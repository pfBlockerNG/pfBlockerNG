# Shared model-tier vocabulary. Values are runtime model identifiers; policy and
# procedures name the tier so provider adapters can select the corresponding model.
# Reviews are the exception on the Claude side: TOP and MID both resolve to
# claude-opus-5 there, so a reviewer's tier choice changes the label, not the model.
TOP_CLAUDE=claude-fable-5
TOP_CODEX=gpt-5.6-sol
MID_CLAUDE=claude-opus-5
MID_CODEX=gpt-5.6-terra
SMALL_CLAUDE=claude-sonnet-5
SMALL_CODEX=gpt-5.6-luna
