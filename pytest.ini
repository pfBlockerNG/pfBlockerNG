# Anchors pytest's rootdir to this branch.
#
# This line ships no pyproject.toml, so pytest used to walk UP the filesystem looking for
# one — and a worktree of this branch lives inside the primary checkout, whose devel-line
# pyproject sets `addopts = "... -n auto"`. The suite then ran in parallel, which two of
# the PHP-runner tests here do not tolerate: a different one failed on each run, in a tree
# whose own CI (`python -m pytest`, no plugins beyond pyyaml) is perfectly green.
#
# An empty-but-present config stops the climb. Keep it free of addopts: this line's CI
# invocation is the contract, and anything set here silently changes it.
[pytest]
testpaths = tests
