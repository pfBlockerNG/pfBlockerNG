name: Issue 2671 memory probe

# TEMPORARY, branch-scoped instrument for issue #2671 (the unexplained PHPStan
# 8.3 1G worker crash). It measures, on the CI's OWN setup-php build, the
# lowest --memory-limit at which `phpstan analyse` still passes -- the only
# meaningful signal per that issue (binary pass/fail at a ceiling; never RSS,
# never PHPStan's self-reported "Used memory").
#
# Round 4 replays the failure itself. Rounds 1-3 measured only today's tree and
# found no factor that moves the ceiling above 576M, so the last untested
# variable is the tree that actually crashed:
#   70d761b46 -- head of the #2658 branch; PHPStan 8.3 crashed at 1G twice
#                (run 32652595526, attempts 1 and 2), 8.5 passed both times.
#   57f626740 -- next push on the same branch; 8.3 crashed at 1G a third time
#                (run 32654033087), 8.5 passed.
# Each leg first replays the exact failing condition five times at 1G -- if the
# crash is a property of the tree it reappears -- then bisects that tree's own
# minimum passing ceiling.
#
# Deleted before the issue closes unless the measurement turns it into the fix.
on:
  push:
    branches:
      - 'issue/2671-**'

permissions:
  contents: read

jobs:
  replay:
    name: Replay / PHP ${{ matrix.php-version }} ${{ matrix.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
        sha:
          - 70d761b46d63d6886ec9df89b33a37ec0fcafd19
          - 57f626740a656082400b58683e5d1ecf5282f5a5

    steps:
      - name: Set up PHP ${{ matrix.php-version }}
        # Byte-identical to the php-static-analysis leg that crashed.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2

      - name: Fetch the tree that crashed
        # The #2658 branch was force-pushed over and then deleted, so these
        # commits are no longer on any ref -- the archive API is the only way
        # back to them.
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          set -eu
          mkdir -p target
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/tarball/$TARGET_SHA" \
            | tar xz --strip-components=1 -C target
          echo "pfblockerng.inc: $(wc -l < target/src/usr/local/pkg/pfblockerng/pfblockerng.inc) lines"
          php -v | head -n 1

      - name: Install PHPStan
        working-directory: target
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Replay at 1G, then bisect
        working-directory: target
        env:
          PROBE_GRANULARITY_MB: '64'
          PROBE_REPLAYS: '5'
        run: |
          set -u
          results=/tmp/probe-results.tsv
          : > "$results"

          # $1 label, $2 memory limit (e.g. 1024M)
          probe() {
            vendor/bin/phpstan clear-result-cache -q >/dev/null 2>&1 || true
            _start=$(date +%s)
            set +e
            _out="$(vendor/bin/phpstan analyse --no-progress --memory-limit="$2" 2>&1)"
            _rc=$?
            set -e
            _elapsed=$(( $(date +%s) - _start ))
            # PHPStan line-wraps its error table, so match on whitespace-collapsed
            # output -- the literal message is not contiguous in the raw text.
            _norm="$(printf '%s' "$_out" | tr -s ' \n\t' ' ')"
            case "$_norm" in
              *'reached configured PHP memory limit'*) _verdict='OOM-worker' ;;
              *'Allowed memory size'*) _verdict='OOM-main' ;;
              *) if [ "$_rc" -eq 0 ]; then _verdict='PASS'; else _verdict="OTHER-FAIL(rc=$_rc)"; fi ;;
            esac
            printf '%s\t%s\t%s\t%ss\n' "$1" "$2" "$_verdict" "$_elapsed" | tee -a "$results"
            if [ "$_verdict" != 'PASS' ]; then
              printf '%s\n' "$_out" | tail -n 8
            fi
            [ "$_verdict" = 'PASS' ]
          }

          # 1. The exact condition CI failed under, repeated. Three of three CI
          #    attempts crashed here, so a tree-borne cause must show up again.
          crashes=0
          n=1
          while [ "$n" -le "$PROBE_REPLAYS" ]; do
            probe "replay-1G #$n" '1024M' || crashes=$(( crashes + 1 ))
            n=$(( n + 1 ))
          done
          replay_line="$(( PROBE_REPLAYS - crashes ))/$PROBE_REPLAYS passed at 1G"

          # 2. This tree's own minimum passing ceiling.
          if probe 'upper-bound' '2048M'; then
            lo=64
            hi=2048
            if probe 'lower-bound' "${lo}M" ; then
              min_line="minimum passing ceiling <= ${lo}M"
            else
              while [ $(( hi - lo )) -gt "$PROBE_GRANULARITY_MB" ]; do
                mid=$(( (lo + hi) / 2 / PROBE_GRANULARITY_MB * PROBE_GRANULARITY_MB ))
                if [ "$mid" -le "$lo" ] || [ "$mid" -ge "$hi" ]; then
                  break
                fi
                if probe 'bisect' "${mid}M"; then
                  hi=$mid
                else
                  lo=$mid
                fi
              done
              min_line="fails at ${lo}M, passes at ${hi}M"
            fi
          else
            min_line='no pass even at 2048M'
          fi

          {
            echo "### PHP ${{ matrix.php-version }} / ${{ matrix.sha }}"
            echo '| run | ceiling | verdict | elapsed |'
            echo '| --- | --- | --- | --- |'
            sed 's/^/| /; s/\t/ | /g; s/$/ |/' "$results"
            echo
            echo "**Replay of the failing condition: $replay_line**"
            echo
            echo "**Minimum passing ceiling: $min_line**"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
