name: Issue 2671 memory probe

# TEMPORARY, branch-scoped instrument for issue #2671 (the unexplained PHPStan
# 8.3 1G worker crash). It measures, on the CI's OWN setup-php build, the
# lowest --memory-limit at which `phpstan analyse` still passes -- the only
# meaningful signal per that issue (binary pass/fail at a ceiling; never RSS,
# never PHPStan's self-reported "Used memory").
#
# Round 3 asks which lever actually moves that ceiling, so the #1122 question
# is answered by measurement rather than assumed:
#   whole-tree   -- the job as it stands (2 jobs, 1 spawned worker).
#   biggest-file -- pfblockerng.inc alone, the per-file floor no scheduling
#                   change can go below while the file stays one file.
#   no-parallel  -- --debug, which analyses everything in the main process, so
#                   the worker stops being the constraint at all.
#
# Deleted before the issue closes unless the measurement turns it into the fix.
on:
  push:
    branches:
      - 'issue/2671-**'

permissions:
  contents: read

jobs:
  ceiling:
    name: Ceiling / PHP ${{ matrix.php-version }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
        mode: [biggest-file, no-parallel]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php-version }}
        # Byte-identical to the php-static-analysis leg that crashed.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2

      - name: Install PHPStan
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ceiling bisect (${{ matrix.mode }})
        env:
          PROBE_GRANULARITY_MB: '64'
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          set -u
          results=/tmp/probe-results.tsv
          : > "$results"

          case "$PROBE_MODE" in
            biggest-file) extra='src/usr/local/pkg/pfblockerng/pfblockerng.inc' ;;
            no-parallel) extra='--debug' ;;
            *) extra='' ;;
          esac

          # $1 label, $2 memory limit (e.g. 1024M)
          probe() {
            vendor/bin/phpstan clear-result-cache -q >/dev/null 2>&1 || true
            _start=$(date +%s)
            set +e
            _out="$(vendor/bin/phpstan analyse --no-progress --memory-limit="$2" $extra 2>&1)"
            _rc=$?
            set -e
            _elapsed=$(( $(date +%s) - _start ))
            # PHPStan line-wraps its error table, so match on whitespace-collapsed
            # output -- the literal message is not contiguous in the raw text.
            _norm="$(printf '%s' "$_out" | tr -s ' \n\t' ' ')"
            case "$_norm" in
              *'reached configured PHP memory limit'*) _verdict='OOM-worker' ;;
              *'Allowed memory size'*) _verdict='OOM-main' ;;
              *) if [ "$_rc" -eq 0 ]; then _verdict='PASS'; else _verdict="OTHER-FAIL(rc=$_rc)"; fi ;;
            esac
            printf '%s\t%s\t%s\t%ss\n' "$1" "$2" "$_verdict" "$_elapsed" | tee -a "$results"
            if [ "$_verdict" != 'PASS' ]; then
              printf '%s\n' "$_out" | tail -n 8
            fi
            [ "$_verdict" = 'PASS' ]
          }

          if probe 'upper-bound' '2048M'; then
            lo=64
            hi=2048
            if probe 'lower-bound' "${lo}M" ; then
              min_line="minimum passing ceiling <= ${lo}M"
            else
              while [ $(( hi - lo )) -gt "$PROBE_GRANULARITY_MB" ]; do
                mid=$(( (lo + hi) / 2 / PROBE_GRANULARITY_MB * PROBE_GRANULARITY_MB ))
                if [ "$mid" -le "$lo" ] || [ "$mid" -ge "$hi" ]; then
                  break
                fi
                if probe 'bisect' "${mid}M"; then
                  hi=$mid
                else
                  lo=$mid
                fi
              done
              min_line="fails at ${lo}M, passes at ${hi}M"
            fi
          else
            min_line='no pass even at 2048M'
          fi

          {
            echo "### PHP ${{ matrix.php-version }} / ${{ matrix.mode }}"
            echo '| run | ceiling | verdict | elapsed |'
            echo '| --- | --- | --- | --- |'
            sed 's/^/| /; s/\t/ | /g; s/$/ |/' "$results"
            echo
            echo "**Minimum passing ceiling ($PROBE_MODE): $min_line**"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
