# Silent Fair Usage mute. Labels only — never comment.
# apply: quota notice -> cr-hold on every OTHER open PR (instant, no checkout)
# poll: reconstruct finished-review times, apply published rolling-hour table,
#       hold when at budget or quota, else release one oldest PR.
# cron is the backstop: "Reviews are available now" is reply-only, not an expiry event.
# Policy: .agents/policy/coderabbit.md
name: CodeRabbit hold

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, ready_for_review, reopened, labeled, unlabeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply-cr-hold:
    name: Label sibling PRs cr-hold
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      (
        contains(github.event.comment.body, 'Review limit reached') ||
        contains(github.event.comment.body, 'rate limited by coderabbit')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Add cr-hold to every open PR except the trigger
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.issue.number }}
        run: |
          set -eu
          gh label create cr-hold --repo "${GITHUB_REPOSITORY}" \
            --description 'Mute CodeRabbit auto-review while Fair Usage is live' \
            --color C4A000 >/dev/null 2>&1 || true
          gh label create cr-go --repo "${GITHUB_REPOSITORY}" \
            --description 'Owner override: do not mute CodeRabbit on this PR' \
            --color 1D76DB >/dev/null 2>&1 || true
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,labels --jq '.[] | "\(.number) \([.labels[].name] | join(","))"' \
            | while read -r n labs; do
            [ "${n}" = "${SOURCE}" ] && continue
            case ",${labs}," in *,cr-go,*) continue ;; esac
            gh pr edit "${n}" --repo "${GITHUB_REPOSITORY}" --add-label cr-hold
          done

  poll-cr-limit:
    name: Poll review budget and apply or release
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'coderabbitai[bot]' &&
        (
          contains(github.event.comment.body, 'Review limit reached') ||
          contains(github.event.comment.body, 'rate limited by coderabbit') ||
          contains(github.event.comment.body, 'Reviews are available now') ||
          contains(github.event.comment.body, 'Actionable comments posted') ||
          contains(github.event.comment.body, 'No actionable comments were generated')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Recompute Fair Usage mute from review ledger
        env:
          GH_TOKEN: ${{ github.token }}
          CODERABBIT_PLAN: pro+
          CODERABBIT_SPARE_SLOTS: "1"
        run: python3 scripts/agent/coderabbit_hold.py poll --repo "${GITHUB_REPOSITORY}"
