name: Tests

# push: runs on direct commits to main/devel (post-merge, admin bypass).
# pull_request: covers feature branches — the push trigger intentionally
# omits them to avoid running two sets of checks on every PR commit.
# For pull requests from forks, GitHub's built-in fork PR approval
# (Settings → Actions → "Require approval for all outside collaborators")
# gates the run: any repository collaborator can approve via the
# "Approve and run" button on the PR page.
#
# paths-ignore: documentation-only changes skip CI entirely (nothing here builds
# or tests docs). A run is skipped only when EVERY changed file matches a pattern
# below, so any commit that also touches code still runs the full suite.
# Caveat: `devel` is not branch-protected today; if the "All tests passed" check is
# ever made a *required* status check, paths-ignore would leave docs-only PRs with a
# never-reported required check (GitHub treats a skipped workflow's check as missing,
# not passing) — at that point pair this with a companion workflow that reports the
# same check name as a success for the ignored paths.
on:
  push:
    branches:
      - main
      - devel
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
  # Manual trigger to opt INTO the benchmark kill-gates (issue #76). They are OFF in
  # the automated push/PR flow: a synthetic corpus on a generic runner is not the
  # number that matters — the production-faithful build-time/RAM measurement belongs
  # on the live smoke VM, timing `updatednsbl` start→finish + unbound RSS. Dispatch
  # Tests with this box ticked to run the offline spikes on demand.
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run the ReDoS + build/RAM benchmark kill-gates (offline spike scripts)'
        type: boolean
        default: false

# Least-privilege GITHUB_TOKEN: every job only reads the repo (checkout, tests,
# lint) — upload-artifact uses the Actions runtime token, not GITHUB_TOKEN — so
# read-only is sufficient. Matches the other workflows (build-*/smoke).
# packages:read is for the ADR-14 Tier-A UI gate (ui-tests.yml pulls the pfSense
# image from private GHCR); it runs only when a PR/push touches PHP/JS.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum (pfSense CE 2.8 / FreeBSD 15 baseline).
        # Also test against the current stable and latest releases.
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        # testpaths and addopts are configured in pyproject.toml
        run: python -m pytest

  test-typing:
    name: Test type checking (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install mypy
        run: pip install mypy

      - name: mypy tests/
        # Config in pyproject.toml: the tests.* override requires
        # disallow_untyped_defs/disallow_incomplete_defs, tests/smoke is excluded,
        # and follow_imports=silent keeps production (incremental) typing out of scope.
        run: mypy tests/

  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        # Config in pyproject.toml.
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Forbid bash shebangs
        # Repo is #!/bin/sh POSIX (no /bin/bash on FreeBSD/pfSense; macOS /bin/bash is
        # the ancient 3.2). Scans ALL tracked files, so it also covers tests/.
        run: |
          bad=$(git ls-files | while IFS= read -r f; do
            case $(head -n1 "$f" 2>/dev/null) in '#!'*bash*) echo "$f" ;; esac
          done)
          if [ -n "$bad" ]; then
            echo "bash shebang not allowed (use #!/bin/sh):"; echo "$bad"; exit 1
          fi

      - name: Parse-check all shell scripts (sh -n)
        # Cheap syntax gate (shell analogue of php -l). Catches unterminated quotes and
        # other parse errors even if ShellCheck is ever disabled. Covers tests/ too
        # (ShellCheck below cannot — shellspec specs trip SC2034 false-positives).
        run: find src scripts tests -name '*.sh' | sort | xargs -n1 sh -n

      - name: Run ShellCheck
        # .shellcheckrc in the repo root configures suppressions. Scoped to src+scripts;
        # tests/ shellspec specs trip SC2034 false-positives (separate cleanup).
        run: find src scripts -name '*.sh' | sort | xargs shellcheck --severity=warning

  shell-tests:
    name: shellspec (POSIX sh)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install jq
        # jq drives the ip_pre_AWS_*.sh region filters (required).
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install shellspec
        # Pinned release tarball; the executable runs from its extracted tree.
        run: |
          curl -fsSL https://github.com/shellspec/shellspec/archive/refs/tags/0.28.1.tar.gz | tar -xz
          echo "$PWD/shellspec-0.28.1" >> "$GITHUB_PATH"

      - name: Run shellspec
        # Config in .shellspec (--shell sh). Functional gate for the shell scripts.
        run: shellspec

      - name: Install kcov (coverage; best-effort)
        # Coverage is informational; if kcov is unavailable on the runner, skip it
        # rather than fail the gating job.
        continue-on-error: true
        run: sudo apt-get install -y kcov

      - name: Coverage (kcov) — informational
        # Informational only (no floor yet, mirroring #38); never gates CI.
        continue-on-error: true
        run: shellspec --kcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-coverage
          path: coverage/
          if-no-files-found: ignore

  php-syntax:
    name: PHP syntax check (php -l)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Syntax-check all PHP and .inc files
        run: find src -name '*.php' -o -name '*.inc' | sort | xargs -n1 php -l

  php-static-analysis:
    name: PHPStan static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHPStan
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        # phpstan.neon configures paths, level, stubs, and includes the
        # baseline (phpstan-baseline.neon) so existing legacy errors are
        # suppressed; new errors introduced by future changes will fail CI.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  php-unit:
    name: PHPUnit unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # Target CE 2.8 (PHP 8.3). pcov drives informational coverage.
          php-version: '8.3'
          extensions: curl, intl, mbstring, ctype, filter
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit (with coverage)
        # Config in phpunit.xml. tests/php/bootstrap.php loads the real
        # pfblockerng.inc via include shims + pfSense doubles — no live box.
        # Single run: still gates on test failure AND prints the informational
        # coverage text (no enforced floor yet — see issue #39 / #38; pcov drives
        # it). NOT suffixed with `|| true` — that would mask a failing suite.
        run: vendor/bin/phpunit --coverage-text

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Run markdownlint-cli2
        # Reads .markdownlint.jsonc (rules) + .markdownlint-cli2.jsonc (globs/ignores).
        run: npx --yes markdownlint-cli2

  benchmarks:
    name: Benchmark kill-gates (ReDoS + build RAM)
    # MANUAL-ONLY (issue #76). The spikes carry their GO/NO-GO verdict in their EXIT
    # CODE (issue #42), but the build-time/RAM number is a synthetic `build()` on a
    # generic runner — NOT what a user experiences. So this job is OFF in the
    # automated push/PR flow and runs only when Tests is dispatched with the
    # `run_benchmarks` input ticked. The production-faithful build-time/RAM
    # regression gate is being moved to the live smoke VM (timing `updatednsbl`
    # start→finish + unbound RSS, baked synthetic fixture) — tracked in #76. The
    # ReDoS gate stays a useful offline check here. Never in `all-tests-passed.needs`.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_benchmarks }}
    runs-on: ubuntu-latest
    # Job-specific timeout: the 1M-entry build spike is the slow step; bound it here
    # rather than touching any shared/default timeout.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        # pympler drives the retained-bytes/entry RAM gate in spike_adr06_build.py;
        # without it that gate is skipped (treated as PASS), so install it to keep
        # the RAM kill-gate live in CI.
        run: pip install pympler

      - name: ReDoS / regex-latency kill-gate (ADR-07)
        # Non-zero exit on NO-GO (reduction-floor / per-pattern-latency / worst
        # first-hit). No `|| true` — the exit code IS the gate.
        run: python benchmarks/spike_adr07_regex.py

      - name: Build init-time / peak-RAM kill-gate (ADR-06)
        # Non-zero exit on NO-GO (build seconds / retained B/entry) at the default
        # 1M-entry un-pruned corpus.
        run: python benchmarks/spike_adr06_build.py

  # ── ADR-14 Tier-A UI render-smoke (PR gate, paths-conditional) ───────────
  # Detect whether this PR/push touches PHP/JS, so the (heavy) Tier-A UI gate
  # boots a pfSense VM ONLY when a WebUI-affecting file changed. No third-party
  # action — a plain `git diff` against the base, matching the repo's
  # minimal-dependency style. Output `php_js` drives the ui-render job's `if:`.
  ui-changes:
    name: Detect PHP/JS changes (Tier-A gate trigger)
    runs-on: ubuntu-latest
    outputs:
      php_js: ${{ steps.filter.outputs.php_js }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need the base commit to diff against; PR runs get a shallow merge ref
          # otherwise. fetch-depth: 0 keeps the diff robust for both events.
          fetch-depth: 0

      - name: Diff PHP/JS paths against the base
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: the merge target. Push: the commit before this push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          BASE="${BASE_SHA:-}"
          # An all-zero SHA (first push to a new branch) or an unreachable base
          # means "no usable base" — fall back to running the gate (conservative).
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base ref (${BASE:-empty}); running the Tier-A gate conservatively."
            echo "php_js=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tier A gates PRs touching src/**/*.php, **/*.inc, src/**/*.js (ADR §2 3a).
          CHANGED="$(git diff --name-only "${BASE}" "${HEAD_SHA}" \
            -- 'src/**/*.php' '**/*.inc' 'src/**/*.js' | tr -d ' ')"
          if [ -n "${CHANGED}" ]; then
            echo "PHP/JS changes detected — Tier A will run:"
            echo "${CHANGED}"
            echo "php_js=true" >> "$GITHUB_OUTPUT"
          else
            echo "No PHP/JS changes — Tier A skipped."
            echo "php_js=false" >> "$GITHUB_OUTPUT"
          fi

  # Tier A render-smoke (ADR-14 §2): authenticated HTTP render sweep of every
  # pfBlockerNG page on the live VM. Cheap/hermetic, so it is the per-PR gate.
  # Runs ONLY when ui-changes found a PHP/JS file (else `if:` skips it -> result
  # 'skipped', which the aggregate treats as a pass). Folded into the "All tests
  # passed" aggregate below so release.yml's verify-checks already covers it.
  ui-render:
    name: Tier-A UI render-smoke (PHP/JS PRs)
    needs: ui-changes
    if: needs.ui-changes.outputs.php_js == 'true'
    uses: ./.github/workflows/ui-tests.yml
    with:
      tier: render
    secrets: inherit

  # Single stable job name for branch-protection required-status-checks.
  # Must use if: always() so it runs (and fails) even when 'test' fails.
  all-tests-passed:
    name: All tests passed
    if: always()
    # NOTE: `benchmarks` is intentionally absent while it is informational-only
    # (issue #42). Add it here + a result check below to make the kill-gates
    # required once their on-runner baseline is stable.
    needs: [test, test-typing, ruff, shellcheck, shell-tests, php-syntax, php-static-analysis, php-unit, markdownlint, ui-changes, ui-render]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more Python test jobs failed or were cancelled."
            exit 1
          fi
          if [ "${{ needs.test-typing.result }}" != "success" ]; then
            echo "Test type checking (mypy) failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.ruff.result }}" != "success" ]; then
            echo "Ruff lint/format check failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.shellcheck.result }}" != "success" ]; then
            echo "ShellCheck failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.shell-tests.result }}" != "success" ]; then
            echo "shellspec shell tests failed or were cancelled."
            exit 1
          fi
          if [ "${{ needs.php-syntax.result }}" != "success" ]; then
            echo "PHP syntax check failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.php-static-analysis.result }}" != "success" ]; then
            echo "PHPStan static analysis failed or was cancelled."
            exit 1
          fi
          if [ "${{ needs.php-unit.result }}" != "success" ]; then
            echo "PHPUnit unit tests failed or were cancelled."
            exit 1
          fi
          if [ "${{ needs.markdownlint.result }}" != "success" ]; then
            echo "markdownlint failed or was cancelled."
            exit 1
          fi
          # The PHP/JS change detector itself must succeed — if it fails or is
          # cancelled, ui-render goes 'skipped' and would otherwise be treated as
          # a pass below, silently disarming the Tier-A gate.
          if [ "${{ needs.ui-changes.result }}" != "success" ]; then
            echo "UI change detector (ui-changes) failed or was cancelled."
            exit 1
          fi
          # Tier-A UI render-smoke (ADR-14): paths-gated, so 'skipped' (no PHP/JS
          # change) is a PASS; only an actual 'failure'/'cancelled' must block.
          # This keeps the gate in the SAME "All tests passed" check-run that
          # release.yml's verify-checks reads — no new required check to wire.
          case "${{ needs.ui-render.result }}" in
            success|skipped) ;;
            *) echo "Tier-A UI render-smoke failed or was cancelled."; exit 1 ;;
          esac
