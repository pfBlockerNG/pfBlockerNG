name: Release published (downstream)

# The one thing that must wait for a GitHub Release to actually be PUBLISHED.
#
# The dispatch workflow deliberately stops at a complete DRAFT (issue #1855): the release notes
# and the final title are authored onto that draft by a human or by Claude, who then
# publishes it. This workflow verifies the published Release's .pkg assets and publishes them
# into pfBlockerNG/pkg's self-hosted catalogue itself (see the publish-pkg-repo job below), so
# it genuinely cannot run before the Release is actually published — hence hanging off the real
# `release: published` event. If it did not exist, publishing a release would silently stop
# refreshing the catalog.
#
# The FreeBSD-ports PORTVERSION bump is NOT here: it runs at the END of the release run
# (the terminal sync-ports-fork job), so that when a run finishes the only
# things left are "write the changelog" and "publish".
#
# Nightly is independent and untagged. This published-Release workflow must not allocate,
# build, or mutate it; tagged release publication never changes the static Nightly port.
#
# Fires for prereleases too (`published` covers a pre-release being published).
on:
  release:
    types: [published]

permissions:
  packages: read
  contents: read

# issue #2389 / #2391: two publishes racing would both stage under docs/staging
# and stomp each other's promote/discard — serialize the whole pipeline (stage
# through promote) rather than just the push at the end.
# cancel-in-progress: false never cancels the CURRENTLY-running publish, but a
# third run queuing behind an already-queued (not yet started) second run still
# cancels that pending second one — its own re-dispatch (re-run the workflow)
# is what carries that release through, not this run.
concurrency:
  group: release-published-pkg-repo
  cancel-in-progress: false

jobs:
  # ── 0. Classify the published tag ────────────────────────────────────────
  # Everything downstream needs is derived from the tag plus its explicit channel
  # trailer, via the single source of truth (scripts/release-version.sh). A published
  # release whose tag or metadata is invalid is a hard error, not a silent skip.
  resolve:
    name: Resolve the published tag
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pfblockerng/ci-runner:9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001:1001
    env:
      HOME: /tmp
    outputs:
      release_id: ${{ steps.classify.outputs.release_id }}
      release_tag: ${{ steps.classify.outputs.tag }}
      source_repository: ${{ steps.classify.outputs.source_repository }}
      destinations: ${{ steps.classify.outputs.destinations }}
      # issue #2389: gate-before-announce identity. channel names the job in
      # human-readable logs (validate-live-pages-install/promote-pkg-repo below);
      # portversion/source_sha are the expected identity the live-install gate
      # asserts against the STAGED catalogue before anything is promoted.
      channel: ${{ steps.classify.outputs.channel }}
      portversion: ${{ steps.classify.outputs.portversion }}
      source_sha: ${{ steps.classify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # SECURITY: release-version.sh below is EXECUTED AS SHELL, and a `release`
          # event would otherwise default this checkout to the RELEASED tag's tree — a
          # tree this workflow does not control. Pin the revision the workflow itself
          # came from instead. The blast radius is small today (no App token, a
          # read-scoped GITHUB_TOKEN, nothing pushed), but that is a property of this
          # job's current body, not of the design: the next credential added here would
          # silently inherit the hole. Same rule as the dispatch workflow's ports helper. Do not
          # "simplify" this to the event ref or the release tag.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the tag
        id: classify
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          [ -n "$TAG" ] || { echo "::error::the published release carries no tag"; exit 1; }
          git fetch --tags --force origin
          TYPE=$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)
          [ "$TYPE" = tag ] || { echo "::error::published tag ${TAG} is not an annotated tag"; exit 1; }
          TRAILERS=$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}" | git interpret-trailers --parse)
          CHANNEL_COUNT=$(printf '%s\n' "$TRAILERS" | grep -Eic '^pfBlockerNG-Release-Channel:' || true)
          [ "$CHANNEL_COUNT" -eq 1 ] || { echo "::error::published tag ${TAG} must carry exactly one release-channel trailer"; exit 1; }
          CHANNEL_LINE=$(printf '%s\n' "$TRAILERS" | grep -F 'pfBlockerNG-Release-Channel:' || true)
          case "$CHANNEL_LINE" in
            'pfBlockerNG-Release-Channel: stable') CHANNEL=stable ;;
            'pfBlockerNG-Release-Channel: testing') CHANNEL=testing ;;
            'pfBlockerNG-Release-Channel: edge') CHANNEL=edge ;;
            *) CHANNEL= ;;
          esac
          [ -n "$CHANNEL" ] || { echo "::error::published tag ${TAG} carries an unknown release-channel trailer"; exit 1; }
          # release-version.sh writes its diagnostics to STDERR, so capturing stdout
          # alone annotated an empty line and buried the real reason in the raw log.
          # On success the script writes nothing to stderr, so `eval` still sees only
          # the KEY=VALUE lines. Newlines are folded out: an annotation is one line.
          if ! OUT=$(sh scripts/release-version.sh "$TAG" "$CHANNEL" 2>&1); then
            echo "::error::cannot classify the published tag ${TAG} — $(printf '%s' "$OUT" | tr '\n' ' ')"
            exit 1
          fi
          eval "$OUT"   # sets version / channel / prerelease / prekind / portversion
          case "${RELEASE_PRERELEASE}:${prerelease}" in
            false:false|true:true) ;;
            *) echo "::error::published Release prerelease flag does not match ${TAG}"; exit 1 ;;
          esac
          if ! git fetch origin --tags --force "+refs/heads/release/*:refs/remotes/origin/release/*"; then
            echo "::error::cannot fetch the derived source line origin/${release_line} for ${TAG}"; exit 1
          fi
          COMMIT=$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null) || {
            echo "::error::published tag ${TAG} does not resolve to a commit"; exit 1; }
          if ! git merge-base --is-ancestor "$COMMIT" "origin/${release_line}"; then
            echo "::error::published tag ${TAG} commit is not reachable from origin/${release_line}"; exit 1
          fi
          DESTINATIONS=$(python3 - "$TAG" "$release_line" "$COMMIT" <<'PY'
          import json
          import sys

          from scripts.release_version import derive_destinations_from_git

          print(json.dumps(list(derive_destinations_from_git(sys.argv[1], sys.argv[2], current_commit=sys.argv[3])), separators=(",", ":")))
          PY
          )
          {
            echo "tag=${TAG}"
            echo "release_id=${RELEASE_ID:-}"
            echo "source_repository=${SOURCE_REPOSITORY:-}"
            echo "channel=${release_channel}"
            echo "source=${release_line}"
            echo "portversion=${portversion}"
            echo "source_sha=${COMMIT}"
            echo "destinations=${DESTINATIONS}"
          } >> "$GITHUB_OUTPUT"
          echo "Published ${TAG}: channel=${release_channel} source=${release_line} portversion=${portversion}"

  # ── 1. Publish the self-hosted pkg catalogue (ADR-17, issue #2146) ────────
  # There is no workflow in pfBlockerNG/pkg any more — it is a content repo. THIS
  # run does everything: verify the published Release's .pkg assets against the
  # pinned ROUTE matrix (scripts/publish_release.py, loading the engine straight
  # out of THIS checkout via PFB_SRC), drop them into pkg's docs/<channel>/<varver>/,
  # prune + regenerate each touched catalogue, regenerate the landing page, and
  # commit + fast-forward-push the result to pkg's own `main` — GitHub Pages serves
  # that branch directly (build_type: legacy), so the push IS the deployment. See
  # scripts/publish-pkg-repo.sh, the only thing here that touches git.
  publish-pkg-repo:
    name: Stage the pkg catalogue
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pfblockerng/ci-runner:9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001:1001
    env:
      HOME: /tmp
    needs: [resolve]
    permissions:
      packages: read
      contents: read
    # issue #2389: this job only STAGES (the "Stage the pkg catalogue" step below
    # pins PUBLISH_STAGE to the stage mode) — it is NOT the deploy/announce.
    # Nothing is visible under <channel>/<varver> or on the landing page until
    # promote-pkg-repo — the actual deploy/announce step — runs the SAME script
    # in `promote` mode, downstream of a green validate-live-pages-install.
    # staging_prefix/touched/noop are the per-run identity that gate +
    # promote/discard consume without re-deriving them (pin-consumed-downstream,
    # #2387); route_matrix carries the ROUTE step's already-fetched matrix
    # through so promote-pkg-repo never re-reads the live ci-metadata ref itself.
    outputs:
      staging_prefix: ${{ steps.stage.outputs.staging_prefix }}
      touched: ${{ steps.stage.outputs.touched }}
      noop: ${{ steps.stage.outputs.noop }}
      route_matrix: ${{ steps.route.outputs.route_matrix }}
    steps:
      - name: Checkout pfBlockerNG (the engine + orchestration scripts — TRUSTED ref)
        uses: actions/checkout@v6
        with:
          # SECURITY: publish-pkg-repo.sh below is EXECUTED AS SHELL and, via
          # publish_release.py, holds an App token able to push to pfBlockerNG/pkg.
          # Same rule as sync-ports-fork: pin the revision the workflow itself came
          # from, never the released tag's tree.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App token (pkg)
        id: app-token
        # Mint a short-lived installation token from the PKG GitHub App, scoped to
        # pfBlockerNG/pkg with Contents:write. The App installation already holds
        # "Read and write access to actions, code, and copilot agent settings" —
        # create-github-app-token NARROWS the minted token to only the permission(s)
        # listed, so contents:write here (not actions:write) is the whole reason
        # the token can push code. REQUIRES the App to be installed on pkg with
        # Contents:write; if it is not, this step fails loudly.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKG_GITHUB_APP_ID }}
          private-key: ${{ secrets.PKG_GITHUB_APP_PRIVATE_KEY }}
          owner: pfBlockerNG
          repositories: pkg
          permission-contents: write

      - name: Checkout pfBlockerNG/pkg
        uses: actions/checkout@v6
        with:
          repository: pfBlockerNG/pkg
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # publish-pkg-repo.sh pushes via this token
          path: pkg-repo
          fetch-depth: 1

      - name: Download release .pkg assets + build the digest sidecar
        # ASSUMED: the GitHub Releases API asset object carries a `digest` field
        # (`sha256:<hex>`) — an INDEPENDENT checksum from the CDN download itself,
        # never recomputed from the same bytes it is meant to check. CI must confirm
        # the live API response for pfBlockerNG/pfBlockerNG actually includes it; a
        # missing digest fails this run closed rather than silently trusting the
        # download. publish_release.py reads this sidecar as
        # <assets-dir>/digests.json.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -eu
          [ -n "$RELEASE_ID" ] || { echo "::error::release_id is empty — the resolve job produced none for this Release"; exit 1; }
          [ -n "$RELEASE_TAG" ] || { echo "::error::release_tag is empty — the resolve job produced none for this Release"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/assets"
          META=$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}")
          PKG_ASSETS=$(printf '%s' "$META" | jq -c '[.assets[] | select(.name | endswith(".pkg"))]')
          [ "$(printf '%s' "$PKG_ASSETS" | jq 'length')" -gt 0 ] || {
            echo "::error::release ${RELEASE_TAG} carries no .pkg assets"; exit 1; }
          BAD=$(printf '%s' "$PKG_ASSETS" | jq '[.[] | select((.digest // "") | startswith("sha256:") | not)] | length')
          [ "$BAD" -eq 0 ] || {
            echo "::error::one or more .pkg release assets have no sha256 digest from the GitHub API"; exit 1; }
          printf '%s' "$PKG_ASSETS" \
            | jq 'map({(.name): (.digest | ltrimstr("sha256:"))}) | add' \
            > "${RUNNER_TEMP}/assets/digests.json"
          gh release download "$RELEASE_TAG" -R "$REPOSITORY" --pattern '*.pkg' --dir "${RUNNER_TEMP}/assets"

      - name: Read the pinned ROUTE matrix
        id: route
        run: |
          set -eu
          git fetch --no-tags --depth 1 origin \
            "+refs/heads/ci-metadata:refs/remotes/origin/ci-metadata"
          ROUTE_MATRIX=$(sh scripts/read-version-matrix.sh --print-route | jq -c .)
          echo "route_matrix=${ROUTE_MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Stage the pkg catalogue
        id: stage
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          DESTINATIONS: ${{ needs.resolve.outputs.destinations }}
          SOURCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
          ROUTE_MATRIX: ${{ steps.route.outputs.route_matrix }}
          BASE_URL: https://pfblockerng.github.io/pkg
          # issue #2389: stage under docs/staging/<seg>/<channel>/<varver> instead
          # of publishing directly — nothing is visible under <channel>/<varver>
          # or on the landing page until promote-pkg-repo runs the SAME script in
          # `promote` mode, after a green live-install gate.
          PUBLISH_STAGE: stage
        # Path env vars are exported HERE, not in the env: map above — GitHub
        # Actions never shell-expands env-map values, so `$GITHUB_WORKSPACE`
        # there reaches the job as a literal dollar-string (issue #2231). The
        # run body is where a shell expands the container-translated value.
        run: |
          set -eu
          export PFB_SRC="$GITHUB_WORKSPACE"
          export PKG_REPO="$GITHUB_WORKSPACE/pkg-repo"
          export ASSETS_DIR="$RUNNER_TEMP/assets"
          sh scripts/publish-pkg-repo.sh

  # ── 2. Prepare the live-install gate matrix (issue #2389) ──────────────────
  # Cross-references what STAGE actually touched (needs.publish-pkg-repo.outputs.touched)
  # against the ci-metadata CI matrix's ci:true legs, so validate-live-pages-install below
  # boots exactly one live VM per (destination channel, testable varver) pair this run
  # actually changed — never the whole matrix, never a stale one. A publish that touched
  # something untestable (no matching CI leg) or something outside the tag's own
  # destinations (state drift between resolve and stage) fails loudly here rather than
  # silently promoting unverified. Skipped entirely on a catalogue no-op (issue #2408):
  # nothing staged means nothing to gate or promote.
  prepare-live-gate:
    name: Prepare the live-install gate matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pfblockerng/ci-runner:9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001:1001
    env:
      HOME: /tmp
    needs: [resolve, publish-pkg-repo]
    if: needs.publish-pkg-repo.outputs.noop != 'true'
    permissions:
      packages: read
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      leg_count: ${{ steps.build.outputs.leg_count }}
    steps:
      - name: Checkout pfBlockerNG (TRUSTED ref)
        uses: actions/checkout@v6
        with:
          # SECURITY: same rule as resolve/publish-pkg-repo above — pin the
          # revision the workflow itself came from, never the released tag's tree.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the CI matrix
        id: ci
        uses: ./.github/actions/read-version-matrix

      - name: Build the live-install gate matrix
        id: build
        env:
          DESTINATIONS: ${{ needs.resolve.outputs.destinations }}
          TOUCHED: ${{ needs.publish-pkg-repo.outputs.touched }}
          CI_MATRIX: ${{ steps.ci.outputs.ci_matrix }}
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os

          from scripts.live_gate_matrix import compute_live_gate_matrix

          destinations = json.loads(os.environ["DESTINATIONS"])
          touched = json.loads(os.environ["TOUCHED"])
          ci_matrix = json.loads(os.environ["CI_MATRIX"])

          matrix, untestable, drifted = compute_live_gate_matrix(destinations, touched, ci_matrix)

          problems = False
          if drifted:
              print(f"::error::touched target(s) outside resolve's destinations (state drift): {drifted}")
              problems = True
          if untestable:
              print(f"::error::touched target(s) with no matching CI leg to live-install-test: {untestable}")
              problems = True
          if not matrix:
              print("::error::prepare-live-gate produced an empty matrix — a publish that touched nothing testable must never silently promote")
              problems = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              fh.write(f"leg_count={len(matrix)}\n")

          if problems:
              raise SystemExit(1)
          PY

  # ── 3. Live Pages pkg install — the gate itself (issue #2389) ──────────────
  # Installs the CANONICAL package from the STAGED catalogue (not yet visible under
  # <channel>/<varver>) on a real pfSense VM per leg prepare-live-gate selected, and
  # asserts its identity (source SHA + version) against what resolve classified. Only
  # a green run here lets promote-pkg-repo move the staged tree into place.
  validate-live-pages-install:
    name: Live Pages install (${{ matrix.channel }} ${{ matrix.pfsense_version }})
    needs: [resolve, publish-pkg-repo, prepare-live-gate]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-live-gate.outputs.matrix) }}
    uses: ./.github/workflows/smoke-single.yml
    with:
      pfsense_version: ${{ matrix.pfsense_version }}
      image_name: ${{ matrix.image_name }}
      mac: ${{ matrix.mac }}
      abi: FreeBSD:${{ matrix.freebsd_major }}:amd64
      php_version: ${{ matrix.php_version }}
      py_flavor: ${{ matrix.py_flavor }}
      extra_pkgs: ${{ toJson(matrix.extra_pkgs) }}
      pytest_marker: repo
      pytest_filter: test_install_from_live_pages_url
      smoke_repo_live_url: https://pfblockerng.github.io/pkg/${{ needs.publish-pkg-repo.outputs.staging_prefix }}/${{ matrix.channel }}
      smoke_repo_expected_source_sha: ${{ needs.resolve.outputs.source_sha }}
      smoke_repo_expected_version: ${{ needs.resolve.outputs.portversion }}
      # SECURITY: same trusted-ref rule as resolve/publish-pkg-repo above — the smoke
      # harness (test code) must come from the workflow's own revision
      # (github.workflow_sha), never the released tag's tree that actions/checkout
      # would default a `release` event to otherwise (smoke-single.yml's own
      # checkout step documents the same default, issue #1859).
      checkout_ref: ${{ github.workflow_sha }}
    secrets: inherit

  # ── 4. Promote the pkg catalogue — the actual announce (issue #2389) ───────
  # This is the ONLY job that makes a publish visible: the catalogue only becomes
  # reachable under <channel>/<varver> and the landing page only regenerates once
  # this job runs the SAME script in `promote` mode. A red or skipped live-install
  # gate flips PUBLISH_STAGE to `discard` instead — the staged tree is deleted and
  # this job then fails the run (below) so nothing was silently announced.
  promote-pkg-repo:
    name: Promote the pkg catalogue
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pfblockerng/ci-runner:9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001:1001
    env:
      HOME: /tmp
    needs: [resolve, publish-pkg-repo, prepare-live-gate, validate-live-pages-install]
    if: always() && needs.publish-pkg-repo.result == 'success' && needs.publish-pkg-repo.outputs.noop != 'true'
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout pfBlockerNG (the engine + orchestration scripts — TRUSTED ref)
        uses: actions/checkout@v6
        with:
          # SECURITY: same rule as resolve/publish-pkg-repo above — pin the
          # revision the workflow itself came from, never the released tag's tree.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App token (pkg)
        id: app-token
        # Same App/token shape as the stage job above — this job pushes the
        # promote (or discard) commit, so it needs its own fresh token.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKG_GITHUB_APP_ID }}
          private-key: ${{ secrets.PKG_GITHUB_APP_PRIVATE_KEY }}
          owner: pfBlockerNG
          repositories: pkg
          permission-contents: write

      - name: Checkout pfBlockerNG/pkg
        uses: actions/checkout@v6
        with:
          repository: pfBlockerNG/pkg
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # publish-pkg-repo.sh pushes via this token
          path: pkg-repo
          fetch-depth: 1

      - name: Promote or discard the staged pkg catalogue
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          DESTINATIONS: ${{ needs.resolve.outputs.destinations }}
          SOURCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
          ROUTE_MATRIX: ${{ needs.publish-pkg-repo.outputs.route_matrix }}
          BASE_URL: https://pfblockerng.github.io/pkg
          STAGING_PREFIX: ${{ needs.publish-pkg-repo.outputs.staging_prefix }}
          # promote iff BOTH the matrix-prep and every live-install leg it fanned
          # out over came back green; anything else (a red leg, a red prep, a
          # cancelled run reaching here via always()) discards the staged tree.
          PUBLISH_STAGE: ${{ (needs.prepare-live-gate.result == 'success' && needs.validate-live-pages-install.result == 'success') && 'promote' || 'discard' }}
          # Diagnostics only — which channel/how many gated legs this run is
          # promoting or discarding.
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          LEG_COUNT: ${{ needs.prepare-live-gate.outputs.leg_count }}
        # Path env vars are exported HERE, not in the env: map above — GitHub
        # Actions never shell-expands env-map values, so `$GITHUB_WORKSPACE`
        # there reaches the job as a literal dollar-string (issue #2231). The
        # run body is where a shell expands the container-translated value.
        run: |
          set -eu
          echo "PUBLISH_STAGE=${PUBLISH_STAGE} channel=${CHANNEL} gated_legs=${LEG_COUNT:-0}"
          export PFB_SRC="$GITHUB_WORKSPACE"
          export PKG_REPO="$GITHUB_WORKSPACE/pkg-repo"
          sh scripts/publish-pkg-repo.sh
          if [ "$PUBLISH_STAGE" = discard ]; then
            echo "::error::live Pages install gate did not pass (prepare-live-gate or validate-live-pages-install failed/cancelled) — staging discarded, nothing announced"
            exit 1
          fi
