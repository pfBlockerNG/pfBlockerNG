name: Smoke spike (ADR-04 P1)

# DE-RISKING SPIKE — workflow_dispatch ONLY. Never auto-runs on push/PR.
#
# Proves the unproven ADR-04 premise on a GH-hosted ubuntu-latest runner,
# on two axes, BEFORE any Packer work:
#   (a) /dev/kvm is exposed and fast enough to boot a real pfSense CE guest;
#   (b) the SSH + pfctl + pfBlockerNG-PHP-CLI + dig + WebUI round-trip works
#       post-boot.
# It boots a HAND-BUILT pfSense+pfBlockerNG qcow2 (maintainer-provided,
# stored privately in GHCR; Phase 2 makes it reproducible), runs the boot +
# round-trip N times, and prints boot-to-ready seconds + a pass count for the
# maintainer to weigh against the §7 kill-threshold (<= ~20 min/job, >= 4/5
# clean). This workflow does NOT decide GO/NO-GO; it MEASURES.
#
# Required config (set before running — see RESULTS/01_Results.txt):
#   SMOKE_IMAGE_REF      private GHCR OCI ref of the qcow2, by digest, e.g.
#                        ghcr.io/<org>/pfsense-smoke@sha256:<digest>.
#                        Accepted as a repo/org *variable* OR a *secret* — the
#                        ref is not sensitive, so a variable is fine; a secret
#                        takes precedence if both are set.
#   SMOKE_GHCR_USER      username for `oras login ghcr.io` (secret)
#   SMOKE_GHCR_TOKEN     PAT/token with read:packages for the GHCR pull (secret)
#   SMOKE_SSH_PRIV_KEY   private SSH key; matching public key is baked into
#                        the image's root authorized_keys (secret)
# Optional inputs override the defaults below.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of boot+round-trip iterations (stability sample)"
        required: false
        default: "2"
      image_file:
        description: "Override the qcow2 path inside the pulled artifact (blank = auto-detect the single .qcow2)"
        required: false
        default: ""
      local_data_name:
        description: "Unbound local-data name the harness injects + digs (deterministic probe)"
        required: false
        default: "smoke-control.pfb.test"
      local_data_ip:
        description: "A-record the harness injects for local_data_name and asserts on the dig"
        required: false
        default: "192.0.2.123"
      boot_timeout:
        description: "Hard boot-to-ready timeout, seconds (a naked pfSense boots well under this)"
        required: false
        default: "120"

permissions:
  contents: read
  packages: read

jobs:
  # Build the branch's .pkg on a FreeBSD VM (matching the pfSense base ABI) and
  # publish it as an artifact the smoke job installs with `pkg add`.
  build-pkg:
    uses: ./.github/workflows/build-pkg.yml
    with:
      channel: devel
    # freebsd_version defaults to 15.0-RELEASE (matches pfSense CE 2.8.1)

  smoke-spike:
    name: KVM boot + control round-trip (spike)
    needs: build-pkg
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable KVM access for the runner user
        # GH-hosted ubuntu-latest ships /dev/kvm but the unprivileged `runner`
        # user is not in the `kvm` group, so qemu -enable-kvm gets EPERM
        # ("Could not access KVM kernel module: Permission denied"). This is a
        # permissions quirk, NOT a missing-KVM NO-GO. The canonical fix: a udev
        # rule making /dev/kvm world-RW, applied in-job (same login session, so
        # no group-membership re-login needed).
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Assert /dev/kvm present and usable
        # Cheapest kill-gate first: no usable KVM => partial NO-GO, stop here.
        run: |
          set -eu
          echo "== /dev/kvm =="
          ls -l /dev/kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is absent on this runner — KVM partial NO-GO"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils dnsutils curl
          echo "== qemu KVM accel probe =="
          # Tiny no-disk boot: if -enable-kvm initialises, KVM accel is usable.
          if qemu-system-x86_64 -enable-kvm -machine pc -cpu host -m 256 \
               -display none -no-reboot -serial none -nographic \
               -kernel /dev/null 2>kvm-probe.log; then
            echo "qemu accepted -enable-kvm"
          else
            # -kernel /dev/null always fails to boot; we only care that KVM
            # accel itself initialised (no 'kvm' init error in the log).
            if grep -qiE 'kvm.*(not|fail|error|permission|no such)' kvm-probe.log; then
              echo "::error::qemu could not initialise KVM acceleration — partial NO-GO"
              cat kvm-probe.log
              exit 1
            fi
            echo "qemu KVM accel initialised (kernel-load failure is expected)"
          fi

      - name: pfSense image cache key (from the GHCR ref)
        id: pfkey
        env:
          # The image ref is not sensitive: accept it as a variable, falling
          # back-compatibly to a secret if one is set (secret wins).
          SMOKE_IMAGE_REF: ${{ secrets.SMOKE_IMAGE_REF || vars.SMOKE_IMAGE_REF }}
        run: |
          set -eu
          if [ -z "${SMOKE_IMAGE_REF:-}" ]; then
            echo "::error::SMOKE_IMAGE_REF is not set (as a variable or a secret)"
            exit 1
          fi
          echo "k=$(printf '%s' "$SMOKE_IMAGE_REF" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Restore cached pfSense image
        id: pfcache
        uses: actions/cache/restore@v5
        with:
          path: image
          key: pfsense-img-${{ steps.pfkey.outputs.k }}

      - name: Install oras
        if: steps.pfcache.outputs.cache-hit != 'true'
        uses: oras-project/setup-oras@v1

      - name: Pull hand-built pfSense image from private GHCR (by digest)
        if: steps.pfcache.outputs.cache-hit != 'true'
        env:
          SMOKE_IMAGE_REF: ${{ secrets.SMOKE_IMAGE_REF || vars.SMOKE_IMAGE_REF }}
          SMOKE_GHCR_USER: ${{ secrets.SMOKE_GHCR_USER }}
          SMOKE_GHCR_TOKEN: ${{ secrets.SMOKE_GHCR_TOKEN }}
        run: |
          set -eu
          echo "$SMOKE_GHCR_TOKEN" | oras login ghcr.io \
            --username "$SMOKE_GHCR_USER" --password-stdin
          mkdir -p image
          oras pull "$SMOKE_IMAGE_REF" --output image
          ls -l image

      # Save right after the pull (before the boot loop) so the image is cached
      # even if a later step fails. The ref is pulled by immutable digest, so the
      # key is stable per image.
      - name: Save pfSense image to cache
        if: steps.pfcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: image
          key: pfsense-img-${{ steps.pfkey.outputs.k }}

      - name: Write private SSH key (mode 600)
        env:
          SMOKE_SSH_PRIV_KEY: ${{ secrets.SMOKE_SSH_PRIV_KEY }}
        run: |
          set -eu
          if [ -z "${SMOKE_SSH_PRIV_KEY:-}" ]; then
            echo "::error::SMOKE_SSH_PRIV_KEY secret is not set"
            exit 1
          fi
          install -m 600 /dev/null smoke_key
          printf '%s\n' "$SMOKE_SSH_PRIV_KEY" > smoke_key
          chmod 600 smoke_key

      - name: Download the built pfBlockerNG package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-pkg.outputs.artifact }}
          path: pkg

      - name: Locate the .pkg
        run: |
          set -eu
          # The build artifact preserves the out/ subdir (multi-path upload), so
          # search recursively rather than assuming pkg/*.pkg.
          PKGFILE="$(find pkg -type f -name '*.pkg' 2>/dev/null | head -1)"
          [ -n "$PKGFILE" ] || { echo "::error::no .pkg in the build artifact"; ls -lR pkg || true; exit 1; }
          echo "PKGFILE=${PKGFILE}" >> "$GITHUB_ENV"
          echo "using package: ${PKGFILE}"

      - name: Boot + round-trip stability loop
        env:
          RUNS: ${{ inputs.runs }}
          IMAGE_FILE: ${{ inputs.image_file }}
          LOCAL_DATA_NAME: ${{ inputs.local_data_name }}
          LOCAL_DATA_IP: ${{ inputs.local_data_ip }}
          BOOT_TIMEOUT: ${{ inputs.boot_timeout }}
        run: |
          set -u
          # The pulled artifact carries exactly one disk image; its filename is
          # irrelevant, so auto-detect the single .qcow2 rather than hardcoding
          # a name. IMAGE_FILE is an optional manual override for the rare case
          # of multiple files in one artifact.
          if [ -n "${IMAGE_FILE:-}" ]; then
            BASE_IMG="image/${IMAGE_FILE}"
            if [ ! -f "$BASE_IMG" ]; then
              echo "::error::override image_file not found in pulled artifact: $BASE_IMG"
              ls -lR image || true
              exit 1
            fi
          else
            N_IMG="$(find image -type f -name '*.qcow2' | wc -l | tr -d ' ')"
            if [ "$N_IMG" -ne 1 ]; then
              echo "::error::expected exactly one .qcow2 in the pulled artifact, found ${N_IMG}; set image_file to disambiguate"
              ls -lR image || true
              exit 1
            fi
            BASE_IMG="$(find image -type f -name '*.qcow2')"
            echo "auto-detected image: $BASE_IMG"
          fi

          PASS=0
          FAIL=0
          BOOT_TIMES=""
          i=1
          while [ "$i" -le "$RUNS" ]; do
            echo "==================== RUN ${i}/${RUNS} ===================="
            # Boot headless in the background; the helper builds its own
            # ephemeral overlay so the base qcow2 is never mutated. QMP_SOCK
            # exposes a control socket so a wedged boot can be screenshotted.
            QMP_SOCK="${RUNNER_TEMP:-/tmp}/pfb-qmp-${i}.sock"
            QMP_SOCK="$QMP_SOCK" tests/smoke/boot_vm.sh "$BASE_IMG" > "vm-${i}.log" 2>&1 &
            VM_PID=$!

            RUN_OK=1
            # Pass VM_PID so the wait bails immediately if QEMU dies (bad image,
            # KVM abort) instead of polling for the full BOOT_TIMEOUT. The
            # trailing 8080 makes readiness require the webConfigurator (nginx +
            # PHP) too, not just sshd — so the install below doesn't race a
            # still-starting web stack.
            if BOOT_OUT="$(tests/smoke/wait_ready.sh smoke_key 127.0.0.1 2222 "$BOOT_TIMEOUT" "$VM_PID" 8080)"; then
              echo "$BOOT_OUT"
              SECS="$(printf '%s' "$BOOT_OUT" | sed -n 's/^boot-to-ready: \([0-9]*\) seconds$/\1/p')"
              BOOT_TIMES="${BOOT_TIMES}${SECS} "
              # The image is a clean pfSense (pfBlockerNG is NOT baked): install
              # the branch's freshly-built .pkg every boot — the disk is an
              # ephemeral overlay, so each run is a clean `pkg add` install of
              # the exact commit under test (properly registered; ADR §2).
              echo "RUN ${i}: installing pfBlockerNG package (${PKGFILE})"
              if scripts/install-pkg.sh root@127.0.0.1 \
                   --port 2222 --ssh-key smoke_key --pkg "$PKGFILE" \
                   && tests/smoke/roundtrip.sh smoke_key "$LOCAL_DATA_NAME" "$LOCAL_DATA_IP" \
                        127.0.0.1 2222 5353 8080; then
                RUN_OK=1
              else
                RUN_OK=0
              fi
            else
              echo "RUN ${i}: VM never became ready"
              echo "---- vm-${i}.log (tail) ----"
              tail -n 40 "vm-${i}.log" || true
              RUN_OK=0
            fi

            # On a failure where the VM is STILL ALIVE, grab the VGA framebuffer
            # before killing it — the only diagnostic for a headless boot stuck
            # at a loader prompt / interface-reassignment menu (serial may show
            # nothing). If QEMU already exited (bad image, KVM abort) there is
            # nothing to screenshot, so skip it and avoid the connect retry.
            if [ "$RUN_OK" -ne 1 ]; then
              if kill -0 "$VM_PID" 2>/dev/null; then
                echo "RUN ${i}: capturing VGA screendump for diagnosis"
                python3 tests/smoke/screendump.py "$QMP_SOCK" "${PWD}/screen-${i}.png" \
                  || echo "RUN ${i}: screendump failed"
              else
                echo "RUN ${i}: QEMU already exited — no framebuffer to capture (see vm-${i}.log)"
              fi
            fi

            # Tear the VM down.
            kill "$VM_PID" 2>/dev/null || true
            wait "$VM_PID" 2>/dev/null || true
            rm -f "$QMP_SOCK"

            if [ "$RUN_OK" -eq 1 ]; then
              PASS=$((PASS + 1))
              echo "RUN ${i}: PASS"
            else
              FAIL=$((FAIL + 1))
              echo "RUN ${i}: FAIL"
            fi
            i=$((i + 1))
          done

          echo "============================================================"
          echo "MEASURED RESULTS (ADR-04 Phase-1 spike)"
          echo "  iterations           : ${RUNS}"
          echo "  pass count           : ${PASS}/${RUNS}"
          echo "  fail count           : ${FAIL}/${RUNS}"
          echo "  boot-to-ready (secs) : ${BOOT_TIMES}"
          echo "------------------------------------------------------------"
          echo "Kill-threshold (ADR §7): <= ~20 min per job AND >= 4/5 clean."
          echo "GO/NO-GO is the MAINTAINER's call from these numbers; this"
          echo "workflow measures, it does not decide."
          echo "============================================================"

          # The job's own pass/fail mirrors the stability sample so a red run
          # is visible at a glance; the maintainer still reads the numbers.
          if [ "$PASS" -eq "$RUNS" ]; then
            exit 0
          fi
          echo "::warning::not all iterations passed — see MEASURED RESULTS above"
          exit 1

      - name: Upload boot logs + screendumps (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-spike-diagnostics
          path: |
            vm-*.log
            screen-*.png
            screen-*.ppm
            kvm-probe.log
          if-no-files-found: ignore
          retention-days: 7
