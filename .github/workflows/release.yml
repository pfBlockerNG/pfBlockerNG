name: Release

# Dispatch-only release pipeline.  The workflow is triggered via workflow_dispatch
# with a `tag` input; it handles the full lifecycle in a single run.
#
# BUILD + VERIFY BEFORE ANYTHING IS TAGGED (issue #1855).  Runs 30419586338
# (v4.0.0.alpha.23) and 30424647767 (v4.0.0.alpha.24) each pushed the tag, created
# the draft Release and attached the .pkg assets BEFORE the verification suites ran
# — both then failed verification and left a tag pointing at unverified code plus a
# draft that had to be deleted unpublished.  The order is now:
#
#   1. prepare-release (real only): validate the tag + channel, refuse a PUBLISHED
#      release, assert CI is green on the branch tip, commit the deterministic
#      changelog placeholder when no curated notes file exists (docs-only, on the
#      channel branch), then PIN the release SHA.  Nothing is tagged here.
#
#   2. read-matrix / resolve-stamp / build-pkgs-portable / ui-suite / smoke-suite:
#      build every artifact FROM THE PINNED SHA as workflow artifacts, then verify
#      them.  Whether the live suites run at all is Part 3's `run_suites` decision
#      (alpha/beta skip them; rc + stable always run them; `force_suites` forces
#      them on) — one code path, the verification phase is simply empty for an
#      alpha/beta.  Which matrix rows may VETO is Part 2's released-status
#      predicate (scripts/resolve-legs.sh, via `release_gate: true`).
#
#   3. tag-release (real only): the FIRST irreversible step.  Creates + pushes the
#      tag on the PINNED SHA — even if the channel branch moved during verification,
#      the tag lands on exactly the commit the artifacts were built from.  (A tag
#      pushed via GITHUB_TOKEN does NOT re-trigger another workflow run, so this run
#      continues to publish.)  Gated on the build AND, when they ran, both suites.
#
#   4. release / attach-pkgs / publish-release / repo-publish / sync-ports-fork:
#      draft Release, assets, healthcheck, publish flip, pkg-repo dispatch, ports
#      sync — real-publish only (dry_run == 'false'), each downstream of the tag.
#
# A failed run therefore leaves NOTHING on GitHub: no tag, no draft.  (The docs-only
# notes commit does land on the channel branch first — it has to be inside the tagged
# tree — and is simply reused by the retry.)
#
# dry_run=true (default): validate + build off HEAD; publish NOTHING (no commit, no
# tag, no Release, no port bump, no pkg-repo poke).
# dry_run=false: the real release — prepare-release runs first, then build + publish.
#
# Tag scheme (single source of truth: scripts/release-version.sh):
#   * vX.Y.Z                       -> STABLE release (from 'main')   -> full release
#   * vX.Y.Z.alpha.N|.beta.N|.rc.N -> ALPHA/BETA/RC  (from 'devel') -> pre-release
# After publishing the GitHub Release, the matching port's PORTVERSION is
# bumped directly on our own FreeBSD-ports fork
# (pfBlockerNG/FreeBSD-ports @ pfblockerng/use-github) — the build-input branch.
# GH_TAGNAME is `v${PORTVERSION}` in the Makefile, so it self-resolves to the
# matching tag and the workflow never sets it.
# Self-hosted distribution (ADR-17): no upstream pfsense/FreeBSD-ports PR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v4.0.0.alpha.1 (REQUIRED)."
        required: true
      dry_run:
        description: "true (default) = validate + build, publish NOTHING. false = cut the real release."
        required: false
        default: true
        type: boolean

      force_suites:
        description: "Run the live smoke/UI suites even for an alpha/beta tag (issue #1855). rc + stable always run them; alpha/beta default to CI-green-on-the-release-commit as the mandatory gate."
        required: false
        default: false
        type: boolean

# Least-privilege default; jobs that need more elevate explicitly below
# (release: contents:write to publish; prepare-release: contents:write to commit +
# push the tag; ui-suite: packages:read to pull the pfSense image from private GHCR).
# sync-ports-fork operates on the FreeBSD-ports fork via PORTS_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read
  packages: read

jobs:
  # ── 0. Prepare release (real publish only) ───────────────────────────────
  # Commits the changelog (when absent) and PINS the release SHA — it does NOT
  # tag (issue #1855: tagging moved to `tag-release`, after build + verify).
  # Skipped entirely on dry_run=true — in that mode every downstream job falls
  # back to the dispatch ref HEAD instead of the pinned SHA.
  prepare-release:
    name: Commit changelog + pin the release commit
    runs-on: ubuntu-latest
    # Only 'false' takes the real-publish path. NOT the whole guard: GitHub compares
    # strings case-insensitively, so 'FALSE' satisfies this too and the first step below
    # re-checks case-sensitively before anything is pushed.
    if: ${{ github.event.inputs.dry_run == 'false' }}
    permissions:
      contents: write
      checks: read    # gh api /commits/<sha>/check-runs to assert CI green

    outputs:
      tag:         ${{ steps.resolve.outputs.tag }}
      branch:      ${{ steps.resolve.outputs.branch }}
      channel:     ${{ steps.resolve.outputs.channel }}
      portversion: ${{ steps.resolve.outputs.portversion }}
      # The PINNED release commit: the channel-branch tip after the notes commit.
      # Every downstream build/verify job checks THIS out, and tag-release tags it.
      sha:         ${{ steps.pin.outputs.sha }}

    steps:
      # The job-level `if:` admits any case-variant of 'false'; re-check case-sensitively
      # BEFORE the checkout that pushes a commit and a tag, so a 'FALSE' dispatch cannot
      # push both and then die at the `release` job's guard, stranding a half-cut release.
      - name: Reject a dry_run that is not exactly true or false
        env:
          INPUT_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          case "$INPUT_DRY" in
            true|false) ;;
            *) echo "::error::dry_run input must be exactly 'true' or 'false' (got: '${INPUT_DRY}')"; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history: tag ancestry + log range
          persist-credentials: true   # need to push branch + tag via GITHUB_TOKEN

      - name: Resolve tag + channel branch
        id: resolve
        # Classify the tag via the single source of truth (scripts/release-version.sh)
        # and map the channel to its canonical branch.  Re-assert the branch<->channel
        # pairing with a second release-version.sh call (must exit 0) before proceeding.
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "::error::tag input is required"; exit 1; }
          OUT=$(sh scripts/release-version.sh "$TAG") || { echo "$OUT"; exit 1; }
          eval "$OUT"   # sets version / channel / prerelease / prekind / portversion
          if [ "$channel" = "devel" ]; then BRANCH="devel"; else BRANCH="main"; fi
          # Re-assert branch<->channel pairing
          sh scripts/release-version.sh "$TAG" "$BRANCH" > /dev/null || {
            echo "::error::tag ${TAG} is not valid for branch ${BRANCH} (channel ${channel})"
            exit 1
          }
          {
            echo "tag=${TAG}"
            echo "branch=${BRANCH}"
            echo "channel=${channel}"
            echo "portversion=${portversion}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG}: channel=${channel} branch=${BRANCH} portversion=${portversion}"

      - name: Check out the channel branch
        # Operate on the live branch tip, not the dispatch ref.  fetch --tags so
        # ancestry checks and the tag-exists guard below work correctly.
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          git fetch origin "$BRANCH" --tags
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Refuse a published release (early, before anything is built)
        id: tag_state
        # A PUBLISHED release is immutable + final → refuse here, before the build
        # burns runner time (bump the version instead). A DRAFT, or no release at
        # all, is resumable: `release` updates the draft in place.
        #
        # issue #1855 narrowed this step: it no longer probes whether the TAG exists.
        # With verification ahead of tagging, a pre-existing tag can only come from a
        # prior run that crashed AFTER tag-release — a window tag-release itself now
        # owns (it re-checks at tag time, against the SHA this run actually verified).
        env:
          TAG:      ${{ steps.resolve.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          STATE=$(gh release view "$TAG" --repo "$REPO" --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "none")
          if [ "$STATE" = "published" ]; then
            echo "::error::a PUBLISHED release for ${TAG} already exists — it is immutable; bump the version"
            exit 1
          fi
          echo "Release state for ${TAG}: ${STATE} — proceeding (resume-safe)."

      - name: Require CI green on the branch tip
        # The tag will point at the current HEAD of the channel branch; assert that
        # CI is green for the code being released. The walk-back semantics + the
        # issue #1077 pagination/pending fixes live in scripts/release-ci-gate.sh,
        # pinned by tests/shell/release_ci_gate_spec.sh.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: sh scripts/release-ci-gate.sh

      - name: Detect committed changelog
        id: detect
        # A committed docs/release-notes/<tag>.md is the curated/authoritative notes;
        # when it exists the write step below is a no-op. When absent, the write step's
        # deterministic placeholder is the ONLY notes path — GitHub Models drafting was
        # removed (it never produced a working result; release run 30379645002); use
        # /release-with-changelog to author real notes before dispatching. Compute the
        # compare-link inputs the placeholder needs either way.
        env:
          TAG:     ${{ steps.resolve.outputs.tag }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          REPO:    ${{ github.repository }}
        run: |
          set -u
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "has_file=true" >> "$GITHUB_OUTPUT"
            echo "Committed ${NOTES_FILE} found — skipping changelog generation."
            exit 0
          fi
          echo "has_file=false" >> "$GITHUB_OUTPUT"

          # Compute previous same-channel tag (same three-pass logic as release job).
          COMMIT="HEAD"
          PREV=$(git tag --sort=-version:refname \
            | { grep -v "^${TAG}$" || true; } \
            | while read -r t; do
                git merge-base --is-ancestor "$t" "$COMMIT" 2>/dev/null || continue
                tch=$(sh scripts/release-version.sh "$t" 2>/dev/null | sed -n 's/^channel=//p') || true
                [ "$tch" = "$CHANNEL" ] && { echo "$t"; break; }
              done) || true
          if [ -z "$PREV" ]; then
            PREV=$(git tag --sort=-version:refname \
              | { grep -v "^${TAG}$" || true; } \
              | while read -r t; do
                  git merge-base --is-ancestor "$t" "$COMMIT" 2>/dev/null && { echo "$t"; break; }
                done) || true
          fi
          if [ -z "$PREV" ]; then
            PREV=$( { git tag; echo "$TAG"; } | LC_ALL=C sort -V -r | uniq \
              | awk -v cur="$TAG" 'found{print; exit} $0==cur{found=1}' ) || true
          fi

          # Compare link the placeholder body ends with.
          if [ -n "$PREV" ]; then
            CMP_URL="https://github.com/${REPO}/compare/${PREV}...${TAG}"
            FULL_LINK="**Full changelog:** [\`${PREV}\` → \`${TAG}\`](${CMP_URL})"
          else
            CMP_URL="https://github.com/${REPO}/commits/${TAG}"
            FULL_LINK="**Full changelog:** [commits in \`${TAG}\`](${CMP_URL})"
          fi

          {
            echo "full_link<<__FL__"
            printf '%s\n' "$FULL_LINK"
            echo "__FL__"
          } >> "$GITHUB_OUTPUT"

      - name: Write + commit the changelog
        id: write-changelog
        # No committed notes file (has_file=false): write the deterministic placeholder
        # — the ONLY path here now that GitHub Models drafting is gone (it never produced
        # a working result; release run 30379645002). Use /release-with-changelog to
        # author real notes before dispatching. Skipped when a committed file already
        # exists (has_file=true).
        if: ${{ steps.detect.outputs.has_file != 'true' }}
        env:
          TAG:       ${{ steps.resolve.outputs.tag }}
          FULL_LINK: ${{ steps.detect.outputs.full_link }}
        run: |
          set -u
          NOTES_FILE="docs/release-notes/${TAG}.md"
          mkdir -p docs/release-notes
          echo "No committed release notes — writing a placeholder notes file."
          printf '_Release notes unavailable; see the full changelog below._\n\n%s\n' "$FULL_LINK" > "$NOTES_FILE"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$NOTES_FILE"
          git commit -m "docs: add release notes for ${TAG}"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "Committed docs/release-notes/${TAG}.md"

      - name: Push the changelog commit + pin the release SHA
        id: pin
        # Push the branch if a changelog commit was made (the notes file has to be
        # inside the tagged tree), then PIN the resulting tip as THE release commit.
        #
        # Everything downstream — the stamp, every .pkg, both live suites, and finally
        # the tag itself — is keyed to this SHA, so a commit landing on the channel
        # branch mid-verification can never end up inside the release. No tag is
        # created here (issue #1855): that is tag-release's job, after verification.
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Push the branch only if we have new commits ahead of the remote.
          if ! git diff --quiet "origin/${BRANCH}..HEAD" 2>/dev/null; then
            git push origin "HEAD:${BRANCH}"
            echo "Pushed changelog commit to ${BRANCH}."
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Pinned release commit: ${SHA} (branch ${BRANCH}) — nothing tagged yet."

  # ── 1b. UI suite (ADR-14, D1) ────────────────────────────────────────────
  # Run the FULL tiered Web-UI suite on the live pfSense VM against the EXACT
  # per-leg .pkg artifacts build-pkgs-portable just built (pkg_artifact_prefix:
  # pfBlockerNG-relpkg, issue #1662) — not a fresh build of its own, so the
  # release gates on the SAME bits that get published. `tier: all` expands the
  # reusable workflow's matrix to one GH job per (tier × version) leg — render
  # / functional / browser × each image — and `fail-fast: false` keeps every
  # leg independent. Because each leg is its own job, GitHub's "Re-run failed
  # jobs" re-runs ONLY a flaky leg; nothing downstream advances until all legs
  # are green again, so a not-our-fault browser flake costs a single-leg
  # re-run — and since issue #1855 it costs it BEFORE anything is tagged.
  #
  # This is a SEPARATE gate ALONGSIDE the CI check asserted by prepare-release
  # (which still asserts the "All tests passed" branch-tip check, covering the
  # Tier-A PR fold). It does not weaken that gate — tag-release `needs:` BOTH
  # this AND smoke-suite (issue #1855: the tag itself, and therefore the draft,
  # the assets and the publish flip, wait on every leg).
  #
  # Whether this job runs at all is read-matrix's `run_suites` decision: an
  # alpha/beta release skips the live suites (Part 3), so this leg is simply
  # absent rather than replaced by a parallel pipeline.
  #
  # §7 browser DEMOTE/DROP — one-line switch: the browser leg is included here as
  # a separate re-runnable leg (the cheap tiers gate firmly; browser adds the
  # JS/screenshot coverage). Per ADR §7, if the first CI evidence misses the
  # reliability threshold (≥ 4/5 clean at ≤ ~25 min/leg), demote it out of the
  # release gate by dropping `browser` from DEFAULT_SCHEDULE_TIERS in ui-tests.yml
  # AND running this with `tier: functional` instead of `tier: all` here — the
  # render + functional legs keep gating the release, the browser leg goes
  # dispatch-only. Tier A + B-HTTP retain full standalone value.
  #
  # Deliberately carries no reference to the dispatch's dry-run input (kept OUT
  # of the mutation-jobs gate set): this runs in BOTH dry-run and real modes,
  # same as build-pkgs-portable already builds in dry-run to validate the .pkg
  # — dry-run parity for the live gates comes free.
  ui-suite:
    name: UI fan-out (all CI legs, live pfSense VM)
    needs: [prepare-release, read-matrix, build-pkgs-portable]
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && needs.read-matrix.result == 'success' && needs.build-pkgs-portable.result == 'success' && needs.read-matrix.outputs.run_suites == 'true' }}
    uses: ./.github/workflows/ui-tests.yml
    with:
      tier: all
      # Explicit (issue #906): a workflow_call callee sees the CALLER's event,
      # so without this the scope ladder resolves `impacted` — min-CE leg only —
      # not the full pre-release fan-out this job exists for.
      scope: full
      # Consume the EXACT per-leg artifacts build-pkgs-portable just built
      # (issue #1662) instead of building its own.
      pkg_artifact_prefix: pfBlockerNG-relpkg
      # issue #1855 Part 2: only a row whose ci-metadata `status` is a RELEASED
      # pfSense version (active, or its legacy alias GA) may veto a release. Every
      # other value — beta today, anything added later, an absent/unrecognized one —
      # still runs and still reports, but cannot fail this call. Each demotion is
      # announced loudly by scripts/resolve-legs.sh, naming the row and its status.
      release_gate: true
    secrets: inherit

  # ── 1b2. Smoke suite (ADR-14 D1 sibling) ─────────────────────────────────
  # Same live-gate contract as ui-suite, one leg per ci:true image, over the
  # SAME per-leg .pkg artifacts (pkg_artifact_prefix: pfBlockerNG-relpkg, issue
  # #1662). Carries no dry-run-input reference either — runs in both modes,
  # same as ui-suite.
  smoke-suite:
    name: Smoke fan-out (all CI legs, live pfSense VM)
    needs: [prepare-release, read-matrix, build-pkgs-portable]
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && needs.read-matrix.result == 'success' && needs.build-pkgs-portable.result == 'success' && needs.read-matrix.outputs.run_suites == 'true' }}
    uses: ./.github/workflows/smoke.yml
    with:
      scope: full
      pkg_artifact_prefix: pfBlockerNG-relpkg
      # Same released-status veto rule as ui-suite above (issue #1855 Part 2).
      release_gate: true
    secrets: inherit

  # ── 1c. Read version matrix ──────────────────────────────────────────────
  # Read the supported-versions matrix from ci-metadata. read-version-matrix.sh
  # (issue #1806) already dedupes the BUILD matrix to one row per distinct
  # freebsd_major — every pfSense-pkg-pfBlockerNG port is NO_ARCH, so one
  # wildcard-ABI .pkg build serves every edition/version sharing a major — so
  # this job passes the reader's build_matrix output straight through; no
  # override step needed. Runs after prepare-release (or in parallel with its
  # skip on dry-run); build-pkgs-portable needs both.
  read-matrix:
    name: Read version matrix
    runs-on: ubuntu-latest
    needs: [prepare-release]
    # Run in both modes: dry-run (prepare-release skipped) AND real (prepare-release succeeded).
    # If prepare-release failed for any reason, do NOT build or publish.
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    outputs:
      build_matrix: ${{ steps.matrices.outputs.build_matrix }}
      pkg_channel:  ${{ steps.channel.outputs.pkg_channel }}
      portversion:  ${{ steps.channel.outputs.portversion }}
      # issue #1855 Part 3: 'true' | 'false' — whether the live smoke/UI suites run
      # (and therefore gate) for THIS tag. Consumed by ui-suite/smoke-suite's `if:`
      # and by tag-release's gate.
      run_suites:   ${{ steps.channel.outputs.run_suites }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history to reach ci-metadata ref and tag
          persist-credentials: false

      - name: Detect pkg channel from tag
        id: channel
        # The channel drives which port we build (devel vs stable). Classified by
        # scripts/release-version.sh: vX.Y.Z.alpha.N|.beta.N|.rc.N -> devel, vX.Y.Z -> stable.
        #
        # It also decides, from the SAME classification, whether the live smoke/UI
        # suites run for this release (issue #1855 Part 3):
        #   prekind alpha|beta -> NO. The mandatory gate is prepare-release's
        #     verify-checks (CI green on the release commit, walking past docs-only
        #     commits). The verification phase is simply EMPTY — not a parallel
        #     pipeline — so the ordering below is unchanged.
        #   prekind rc, or stable -> YES, in full, gated per the released-status
        #     predicate, and the tag/publish happen only on green.
        # `force_suites` is the manual escape hatch: it can only ever ADD
        # verification (rc/stable already run the suites unconditionally).
        env:
          INPUT_TAG:    ${{ github.event.inputs.tag }}
          FORCE_SUITES: ${{ github.event.inputs.force_suites }}
        run: |
          TAG="$INPUT_TAG"
          OUT=$(sh scripts/release-version.sh "$TAG") || { echo "$OUT"; exit 1; }
          eval "$OUT"
          case "$prekind" in
            alpha|beta) RUN_SUITES="false" ;;
            *)          RUN_SUITES="true"  ;;
          esac
          # An API dispatch can send any casing for a boolean input; accept them all
          # here because forcing the suites ON is always the safe direction.
          case "${FORCE_SUITES:-}" in
            [Tt][Rr][Uu][Ee]) RUN_SUITES="true" ;;
          esac
          {
            echo "pkg_channel=${channel}"
            echo "portversion=${portversion}"
            echo "run_suites=${RUN_SUITES}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}  →  pkg channel: ${channel}  portversion: ${portversion}"
          echo "Live smoke/UI suites for this release: ${RUN_SUITES} (prekind='${prekind:-stable}', force_suites='${FORCE_SUITES:-false}')"

      - name: Read matrix from ci-metadata
        id: matrices
        uses: ./.github/actions/read-version-matrix

  # ── 1d. Resolve build stamp ──────────────────────────────────────────────
  # Checks out the SAME ref as build-pkgs-portable so that `created` (epoch of the
  # tagged commit) and `commit` (the tagged SHA) are stamped from the right tree.
  # AMENDMENT 2: must NOT compute these in read-matrix (different checkout ref) or
  # inline in build-pkgs-portable (its matrix legs share ONE checkout per job via
  # strategy.matrix, each running build-leg.sh once -- there's no loop to hang a
  # git command off of). One job, one checkout, two outputs.
  resolve-stamp:
    name: Resolve build stamp (created + commit)
    runs-on: ubuntu-latest
    needs: [prepare-release]
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    outputs:
      created: ${{ steps.stamp.outputs.created }}
      commit:  ${{ steps.stamp.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          # issue #1855: the PINNED release commit (prepare-release), not the tag —
          # nothing is tagged yet at this point. Empty on dry-run (prepare-release is
          # skipped) → the dispatch ref, exactly as before.
          ref: ${{ needs.prepare-release.outputs.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve stamp
        id: stamp
        run: |
          echo "created=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── 1e. Tag the verified commit (real publish only) ──────────────────────
  # THE FIRST IRREVERSIBLE STEP (issue #1855). Everything before this job is
  # local to the run: artifacts in the run's own storage, suites against those
  # artifacts. Nothing is on GitHub yet except the docs-only notes commit.
  #
  # Creates + pushes the annotated tag on prepare-release's PINNED SHA — never on
  # "whatever the branch tip is now" — so the tag names exactly the tree the .pkgs
  # were built from and the suites verified, even if the channel branch moved
  # during a 40-minute live fan-out.
  #
  # GATE: the build must have succeeded AND, when the live suites ran for this
  # channel, both AND-gates must be green. For an alpha/beta (run_suites=false)
  # the verification phase is empty and the mandatory gate is prepare-release's
  # CI-green-on-the-release-commit check — the tolerance is a POSITIVE
  # `run_suites == 'false'` comparison, and read-matrix must itself have
  # succeeded, so a crashed matrix read can never read as "no suites required".
  #
  # A tag pushed via GITHUB_TOKEN does NOT re-trigger this workflow (GitHub's
  # re-trigger rule), so this same run continues into publish — no recursion.
  tag-release:
    name: Create + push the release tag (verified build only)
    runs-on: ubuntu-latest
    needs: [prepare-release, read-matrix, build-pkgs-portable, ui-suite, smoke-suite]
    if: ${{ always() && github.event.inputs.dry_run == 'false' && needs.prepare-release.result == 'success' && needs.read-matrix.result == 'success' && needs.build-pkgs-portable.result == 'success' && (needs.read-matrix.outputs.run_suites == 'false' || (needs.ui-suite.result == 'success' && needs.smoke-suite.result == 'success')) }}
    permissions:
      contents: write

    outputs:
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0             # full history + tags: the resume check below
          persist-credentials: true  # need to push the tag via GITHUB_TOKEN

      - name: Create + push the tag on the verified commit
        id: tag
        # RESUME semantics, narrowed to the crash-after-tag window: the only
        # legitimate reason for the tag to already exist is a prior run of THIS tag
        # that died after tagging. Then it points at the same pinned SHA and is
        # reused as-is. A tag on any OTHER commit means the artifacts this run
        # verified do not match it — refuse loudly and leave it untouched rather
        # than move a tag or publish mismatched assets.
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          SHA: ${{ needs.prepare-release.outputs.sha }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null 2>&1; then
            EXISTING=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::tag ${TAG} already exists at ${EXISTING}, but this run built and verified ${SHA} — delete the stale (unpublished) tag or bump the version"
              exit 1
            fi
            echo "Tag ${TAG} already at ${SHA} — reusing it (resuming a run that crashed after tagging)."
          else
            git tag -a "$TAG" -m "$TAG" "$SHA"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed tag ${TAG} at ${SHA}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  # ── 2. Release ───────────────────────────────────────────────────────────
  release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    # issue #1855: the draft is created only AFTER the tag exists on the verified
    # commit — softprops/action-gh-release CREATES a missing tag itself, which is
    # exactly how a failed run used to strand one. In dry-run prepare-release (and
    # therefore tag-release) is skipped and this job still runs, publishing nothing:
    # it renders the body into the run summary. The live suites gate tag-release,
    # so this job inherits them transitively — a flaky live leg still re-runs in
    # isolation (ADR-14 D1) without redoing the draft/changelog.
    needs: [prepare-release, read-matrix, build-pkgs-portable, tag-release]
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && needs.read-matrix.result == 'success' && needs.build-pkgs-portable.result == 'success' && (needs.tag-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    permissions:
      contents: write

    outputs:
      tag:         ${{ steps.meta.outputs.tag }}
      version:     ${{ steps.meta.outputs.version }}
      prerelease:  ${{ steps.meta.outputs.prerelease }}
      branch:      ${{ steps.meta.outputs.branch }}
      portversion: ${{ steps.meta.outputs.portversion }}
      dry_run:     ${{ steps.meta.outputs.dry_run }}

    steps:
      - uses: actions/checkout@v6
        with:
          # issue #1855: the PINNED release commit — identical content to the tag
          # tag-release just created on it, without depending on the tag having
          # propagated. Empty on dry-run → the dispatch ref, exactly as before.
          ref: ${{ needs.prepare-release.outputs.sha || github.ref }}
          fetch-depth: 0   # need full history for changelog
          persist-credentials: false

      - name: Gather release metadata
        id: meta
        # Validate + classify the tag via the single source of truth
        # (scripts/release-version.sh).  This workflow is always workflow_dispatch;
        # dry_run=false is the real publish path (prepare-release already ran the gates);
        # dry_run=true is the validation harness (runs off HEAD, publishes nothing).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          # An API dispatch can hand this an arbitrary string despite the boolean input
          # type, so reject anything but true/false before any $GITHUB_OUTPUT is written.
          # Empty stays the safe default.
          DRY_RUN="${INPUT_DRY:-true}"
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "::error::dry_run input must be exactly 'true' or 'false' (got: '${INPUT_DRY}')"; exit 1 ;;
          esac
          TAG="$INPUT_TAG"
          [ -n "$TAG" ] || { echo "::error::tag input is required"; exit 1; }

          if [ "$DRY_RUN" = "true" ]; then
            # Dry-run: simulate off HEAD — branch<->channel enforcement is skipped since
            # the tag doesn't exist yet and we're validating format + build only.
            BRANCH=""
          else
            # Real publish: the tag was created by prepare-release on the channel branch;
            # resolve the branch from the channel classification so downstream jobs have it.
            OUT=$(sh scripts/release-version.sh "$TAG") || { echo "$OUT"; exit 1; }
            eval "$OUT"   # sets channel (+ version / prerelease / prekind / portversion)
            if [ "$channel" = "devel" ]; then BRANCH="devel"; else BRANCH="main"; fi
            # Re-assert branch<->channel pairing (belt-and-braces; prepare-release already did this)
            sh scripts/release-version.sh "$TAG" "$BRANCH" > /dev/null || {
              echo "::error::tag ${TAG} is not valid for branch ${BRANCH} (channel ${channel})"
              exit 1
            }
          fi

          OUT=$(sh scripts/release-version.sh "$TAG") || { echo "$OUT"; exit 1; }
          eval "$OUT"   # sets version / channel / prerelease / prekind / portversion

          # Dry-run has no branch context from the tag; map channel to its canonical branch.
          if [ -z "$BRANCH" ]; then
            [ "$channel" = "devel" ] && BRANCH="devel" || BRANCH="main"
          fi

          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
            echo "portversion=${portversion}"
            echo "branch=${BRANCH}"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG}: channel=${channel} prerelease=${prerelease} portversion=${portversion} dry_run=${DRY_RUN}"

      - name: Find the previous release tag (compare base)
        id: prev_tag
        # The previous release = the highest-version tag of the SAME channel that is an
        # ANCESTOR of the current release's commit — the natural "previous release of this
        # channel" the notes diff against. Falls back to the highest ancestor tag of any
        # channel, then to the next-lower version tag overall, so a genesis release (no
        # same-channel predecessor) still gets a meaningful compare base. For a dry-run
        # the "commit" is the checked-out ref HEAD; for a real publish it is the tag.
        env:
          TAG:     ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then COMMIT="HEAD"; else COMMIT="$TAG"; fi
          # 1) Highest-version SAME-channel ancestor tag. release-version.sh classifies
          #    each tag's channel; the `|| true` guards keep pipefail from tripping on an
          #    empty tag list / a non-scheme tag.
          PREV=$(git tag --sort=-version:refname \
            | { grep -v "^${TAG}$" || true; } \
            | while read -r t; do
                git merge-base --is-ancestor "$t" "$COMMIT" 2>/dev/null || continue
                tch=$(sh scripts/release-version.sh "$t" 2>/dev/null | sed -n 's/^channel=//p') || true
                [ "$tch" = "$CHANNEL" ] && { echo "$t"; break; }
              done) || true
          # 2) Fallback: highest-version ANCESTOR tag of ANY channel.
          if [ -z "$PREV" ]; then
            PREV=$(git tag --sort=-version:refname \
              | { grep -v "^${TAG}$" || true; } \
              | while read -r t; do
                  git merge-base --is-ancestor "$t" "$COMMIT" 2>/dev/null && { echo "$t"; break; }
                done) || true
          fi
          # 3) Final fallback (rebased/diverged history): the next-lower version tag overall.
          if [ -z "$PREV" ]; then
            PREV=$( { git tag; echo "$TAG"; } | LC_ALL=C sort -V -r | uniq \
              | awk -v cur="$TAG" 'found{print; exit} $0==cur{found=1}' ) || true
          fi
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous ${CHANNEL} release tag: ${PREV:-<none>}"

      - name: Prepare release-notes inputs
        id: notes_prep
        # Compute the compare-link inputs the placeholder/committed-notes body needs.
        # GitHub Models drafting was removed (it never produced a working result;
        # release run 30379645002) — a committed docs/release-notes/<tag>.md is now the
        # only real notes source; the assemble-body step below falls back to a
        # deterministic placeholder ending in this compare link. Use
        # /release-with-changelog to author real notes before dispatching.
        env:
          REPO: ${{ github.repository }}
          TAG:  ${{ steps.meta.outputs.tag }}
          PREV: ${{ steps.prev_tag.outputs.tag }}
        run: |
          set -u
          if [ -n "$PREV" ]; then
            CMP_URL="https://github.com/${REPO}/compare/${PREV}...${TAG}"
            FULL_LINK="**Full changelog:** [\`${PREV}\` → \`${TAG}\`](${CMP_URL})"
          else
            CMP_URL="https://github.com/${REPO}/commits/${TAG}"
            FULL_LINK="**Full changelog:** [commits in \`${TAG}\`](${CMP_URL})"
          fi

          echo "cmp_url=${CMP_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "full_link<<__FL__"
            printf '%s\n' "$FULL_LINK"
            echo "__FL__"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release body
        id: changelog
        # Precedence: a committed docs/release-notes/<tag>.md (curated, or committed by
        # prepare-release's placeholder writer) wins; otherwise a deterministic
        # placeholder — GitHub Models drafting was removed (it never produced a working
        # result; release run 30379645002); use /release-with-changelog to author real
        # notes before dispatching. Always guarantees the compare link is present. Runs
        # on every event, so a dry-run shows the real body that would be published.
        env:
          TAG:       ${{ steps.meta.outputs.tag }}
          VERSION:   ${{ steps.meta.outputs.version }}
          CMP_URL:   ${{ steps.notes_prep.outputs.cmp_url }}
          FULL_LINK: ${{ steps.notes_prep.outputs.full_link }}
        run: |
          set -u
          SUMMARY=""
          BODY=""
          NOTES_FILE="docs/release-notes/${TAG}.md"

          if [ -f "$NOTES_FILE" ]; then
            echo "Using committed ${NOTES_FILE}"
            # Optional first-line marker '<!-- SUMMARY: ... -->' becomes the title suffix
            # and is stripped from the rendered body.
            SUMMARY=$(sed -n 's/^<!-- SUMMARY:[[:space:]]*\(.*[^[:space:]]\)[[:space:]]*-->[[:space:]]*$/\1/p' "$NOTES_FILE" | head -1 | tr -d '\r') || true
            BODY=$(sed '/^<!-- SUMMARY:.*-->[[:space:]]*$/d' "$NOTES_FILE")
          fi

          if [ -z "$BODY" ]; then
            echo "No committed notes — using a placeholder."
            BODY=$(printf '_Release notes unavailable; see the full changelog below._\n\n%s' "$FULL_LINK")
          fi

          # Guarantee the compare link is present (append if the source omitted it).
          case "$BODY" in
            *"${CMP_URL}"*) ;;
            *) BODY=$(printf '%s\n\n%s' "$BODY" "$FULL_LINK") ;;
          esac

          # Release title: ISO publish date + version, plus the short summary when we have
          # one. The date prefix (UTC, yyyy-mm-dd) keeps GitHub's alphabetical release sort
          # in chronological order. Product name is omitted — this repo only ships pfBlockerNG.
          DATE=$(date -u +%Y-%m-%d)
          if [ -n "$SUMMARY" ]; then
            NAME="${DATE} - ${VERSION} — ${SUMMARY}"
          else
            NAME="${DATE} - ${VERSION}"
          fi

          # Emit name + body to the step output (consumed by the publish step) …
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<__RELEASE_BODY__"
            printf '%s\n' "$BODY"
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

          # … and to the run summary, so a dry-run shows exactly what would be published.
          {
            echo "### Rendered release — ${TAG}"
            echo ""
            echo "**Title:** ${NAME}"
            echo ""
            printf '%s\n' "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build source archive
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCHIVE="pfBlockerNG-${VERSION}.tar.gz"

          # src/ is the production filesystem overlay; dev tooling is outside it
          tar -czf "$ARCHIVE" \
            --exclude="*.pyc" \
            --exclude="__pycache__" \
            src/
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Dry-run validation summary (no publish)
        if: ${{ steps.meta.outputs.dry_run == 'true' }}
        env:
          TAG:         ${{ steps.meta.outputs.tag }}
          CHANNEL:     ${{ steps.meta.outputs.channel }}
          PRERELEASE:  ${{ steps.meta.outputs.prerelease }}
          PORTVERSION: ${{ steps.meta.outputs.portversion }}
          PREV:        ${{ steps.prev_tag.outputs.tag }}
        run: |
          {
            echo "## Dry-run release validation — ${TAG}"
            echo ""
            echo "Publishing is SKIPPED (dry_run=true). The rendered body is shown above."
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| channel | ${CHANNEL} |"
            echo "| prerelease | ${PRERELEASE} |"
            echo "| PORTVERSION | ${PORTVERSION} |"
            echo "| previous tag | ${PREV:-<none>} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release as a DRAFT
        # This repo has IMMUTABLE RELEASES enabled: once a release is PUBLISHED its
        # assets are frozen, so assets can only be added while it is still a draft.
        # Create it as a draft here (with the source archive), let attach-pkgs add the
        # .pkg assets to the same draft, then the publish-release job flips it to
        # published — at which point immutability locks it with ALL assets present.
        # (draft: true defers the release.published event to the publish-release step.)
        if: ${{ steps.meta.outputs.dry_run == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.changelog.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft: true
          # Idempotent on re-run: update the existing draft and replace its source
          # archive rather than erroring or duplicating it.
          overwrite_files: true
          files: ${{ env.ARCHIVE }}

  # ── 2b. Build .pkg artifacts (portable Linux builder) ────────────────────
  # Builds ONE .pkg per DISTINCT FreeBSD major (issue #1806): read-matrix's
  # build_matrix is already deduped by read-version-matrix.sh -- every
  # pfSense-pkg-pfBlockerNG port is NO_ARCH, so one wildcard-ABI build serves
  # every arch AND every edition/version sharing a major. Runs the portable
  # Linux builder steps inline (no FreeBSD VM, ~3 min/leg). This is the SOLE
  # release .pkg builder: pfBlockerNG is a NO_BUILD port, so the portable
  # builder reproduces `make package` byte-for-byte (validated against it over
  # every smoke + Web-UI run on CE and Plus) and `pkg add` checks a dep is
  # PRESENT, not its version — so the portable artifact installs identically.
  #
  # ONE JOB PER MAJOR (strategy.matrix over read-matrix's build_matrix,
  # fail-fast: false): each leg uploads its OWN artifact, named exactly
  # `pfBlockerNG-relpkg-fbsd<freebsd_major>` — the EXACT name ui-tests.yml's/
  # smoke.yml's pkg_artifact_prefix consumer side downloads, so ui-suite/
  # smoke-suite below gate on the SAME bits this job built, not a fresh
  # rebuild of their own.
  #
  # A leg's build failure surfaces as a red leg (fail-fast: false keeps the
  # others going). sync-ports-fork's own `needs:` list is [prepare-release,
  # release, publish-release] -- it never lists build-pkgs-* directly -- but a
  # leg failure blocks it TRANSITIVELY: build-pkgs-portable fails (matrix job
  # result is 'failure' if any leg fails) -> tag-release skips (its `if:`
  # requires needs.build-pkgs-portable.result == 'success') -> release skips
  # -> attach-pkgs, publish-release and sync-ports-fork all skip. Since issue
  # #1855 that chain starts BEFORE the tag exists, so a failed build leaves no
  # tag and no draft behind at all.
  build-pkgs-portable:
    name: "build .pkg — FreeBSD ${{ matrix.freebsd_major }}"
    runs-on: ubuntu-latest
    needs: [prepare-release, read-matrix, resolve-stamp]
    # Same gate as release: run in both dry-run (skipped) and real (succeeded) modes.
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && needs.read-matrix.result == 'success' && needs.resolve-stamp.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read-matrix.outputs.build_matrix) }}

    steps:
      - name: Checkout the pinned release source
        uses: actions/checkout@v6
        with:
          # issue #1855: build from prepare-release's PINNED SHA — the channel-branch
          # tip including the committed changelog. The tag is created LATER, on this
          # very SHA, so the published .pkg and the tag can never disagree even if
          # the branch moves during verification. Empty on dry-run (prepare-release
          # skipped) → the dispatch ref, exactly as before.
          ref: ${{ needs.prepare-release.outputs.sha || github.ref }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure zstd encoder is present
        run: command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zstd; }

      - name: Compute this leg's LEG/ABI (one .pkg per FreeBSD major)
        id: leg
        # issue #1806: the leg key is freebsd_major ALONE -- read-matrix's
        # build_matrix is already deduped to one row per major, so there is no
        # variant/version/arch left to slug. ABI's cpu segment ("amd64") is an
        # INERT placeholder: build-pkg-portable.py wildcards the stamp for any
        # NO_ARCH port regardless of what's given, so the one .pkg this leg
        # builds serves every arch of this FreeBSD major.
        env:
          MAJOR: ${{ matrix.freebsd_major }}
        run: |
          set -eu
          ABI="FreeBSD:${MAJOR}:amd64"
          LEG="fbsd${MAJOR}"
          {
            echo "abi=${ABI}"
            echo "leg=${LEG}"
          } >> "$GITHUB_OUTPUT"
          echo "leg ${LEG}: ABI=${ABI}"

      - name: Build the .pkg via build-leg.sh
        # build-leg.sh is the shared build path (local/CI/release parity — ADR-47 P3).
        # portversion pinned from read-matrix (ref-independent, tag-string-derived).
        # created + commit from resolve-stamp (same checkout ref as this job's tree).
        env:
          PKG_CHANNEL:  ${{ needs.read-matrix.outputs.pkg_channel }}
          PORTVERSION:  ${{ needs.read-matrix.outputs.portversion }}
          CREATED:      ${{ needs.resolve-stamp.outputs.created }}
          COMMIT:       ${{ needs.resolve-stamp.outputs.commit }}
          ABI:          ${{ steps.leg.outputs.abi }}
          LEG:          ${{ steps.leg.outputs.leg }}
          PHP:          ${{ matrix.php_version }}
          PY:           ${{ matrix.py_flavor }}
          MAJOR:        ${{ matrix.freebsd_major }}
          EXTRA_PKGS:   ${{ toJson(matrix.extra_pkgs) }}
          # Place the run-keyed out dir under $GITHUB_WORKSPACE/out so the
          # rename step below finds this leg's .pkg without any path remapping.
          PFB_RUN_ROOT: ${{ github.workspace }}/out
        run: |
          set -eu
          export LEG
          RUN_ID="$(sh scripts/select-box.sh --print-id)"
          export RUN_ID

          echo "--- Building .pkg for FreeBSD ${MAJOR}, PHP ${PHP}, ${PY} ---"

          PKG="$(sh scripts/build-leg.sh \
            --channel    "$PKG_CHANNEL" \
            --abi        "$ABI" \
            --py-flavor  "$PY" \
            --php        "$PHP" \
            --pkgversion "$PORTVERSION" \
            --annotate   "created=${CREATED}" \
            --annotate   "commit=${COMMIT}")"

          PKG_DIR="$(dirname "$PKG")"
          echo "Built for FreeBSD ${MAJOR}:"
          ls -l "${PKG_DIR}"

          # Rename to embed the FreeBSD major, so this leg's .pkg filename
          # stays unambiguous inside its own artifact.
          BASE="$(basename "$PKG" .pkg)"
          RENAMED="${PKG_DIR}/${BASE}-FreeBSD-${MAJOR}.pkg"
          mv "$PKG" "$RENAMED"
          echo "Renamed: ${BASE}.pkg -> $(basename "$RENAMED")"
          echo "PKG_PATH=${RENAMED}" >> "$GITHUB_ENV"

          # issue #1806 B1: this row's extra_pkgs (RUN_DEPENDS ports pfSense's
          # own repo doesn't carry, e.g. textproc/py-charset-normalizer) --
          # SAME loop as build-pkg-linux.yml, from the SAME ports checkout
          # build-leg.sh just prepared above (never a second clone).
          # read-matrix's build_matrix is already deduped one row per major, so
          # this leg is the only one ever building this major's dep .pkgs.
          DEP_PKG_DIR="${PFB_RUN_ROOT}/${RUN_ID}/deppkgs"
          HAS_DEP_PKGS=0
          ORIGIN_COUNT="$(printf '%s' "${EXTRA_PKGS:-[]}" | jq 'length // 0')"
          if [ "$ORIGIN_COUNT" -gt 0 ]; then
            PORTS_DIR="${PFB_RUN_ROOT}/${RUN_ID}/ports"
            mkdir -p "$DEP_PKG_DIR"
            I=0
            while [ "$I" -lt "$ORIGIN_COUNT" ]; do
              ORIGIN="$(printf '%s' "$EXTRA_PKGS" | jq -r ".[$I]")"
              # sparse-clone-ports.sh's checkout only includes the pfBlockerNG
              # port's OWN RUN_DEPENDS -- extra_pkgs is a matrix-level concept
              # it doesn't know about, so this origin's dir was never
              # materialized. Add it explicitly (idempotent; cone mode already
              # set by sparse-clone-ports.sh).
              git -C "$PORTS_DIR" sparse-checkout add "$ORIGIN"
              python3 scripts/build-dep-pkg-portable.py \
                --ports "$PORTS_DIR" \
                --port "$ORIGIN" \
                --py-flavor "$PY" \
                --freebsd-major "$MAJOR" \
                --out-dir "$DEP_PKG_DIR"
              I=$((I + 1))
            done
            HAS_DEP_PKGS=1
          fi
          echo "DEP_PKG_DIR=${DEP_PKG_DIR}" >> "$GITHUB_ENV"
          echo "HAS_DEP_PKGS=${HAS_DEP_PKGS}" >> "$GITHUB_ENV"

      - name: Upload this leg's .pkg artifact (exact-name contract, issue #1806)
        # Name MUST equal pfBlockerNG-relpkg-fbsd<freebsd_major> -- the EXACT
        # name ui-tests.yml's/smoke.yml's pkg_artifact_prefix download step
        # composes when pkg_artifact_prefix: pfBlockerNG-relpkg is set (see
        # ui-suite/smoke-suite below). Upload only on success: fail-fast:
        # false already isolates a failed leg, so it simply uploads nothing
        # and attach-pkgs/the publish healthcheck fail closed on the missing
        # asset.
        uses: actions/upload-artifact@v7
        with:
          name: pfBlockerNG-relpkg-fbsd${{ matrix.freebsd_major }}
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload this leg's dep .pkg artifact (issue #1806 B1)
        # Name MUST equal pfBlockerNG-relpkg-deppkgs-fbsd<freebsd_major> -- the
        # EXACT name smoke.yml's/ui-tests.yml's pkg_artifact_prefix ==
        # 'pfBlockerNG-relpkg' download steps compose (dep_pkg_artifact /
        # the "Download dep packages" ternary). Never uploaded when
        # extra_pkgs is empty (no empty artifacts) -- a SEPARATE artifact
        # from the branch .pkg above, never folded into it.
        if: env.HAS_DEP_PKGS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pfBlockerNG-relpkg-deppkgs-fbsd${{ matrix.freebsd_major }}
          path: ${{ env.DEP_PKG_DIR }}/*.pkg
          if-no-files-found: error
          retention-days: 7

  # ── 2c. Attach .pkg artifacts to the GitHub Release ──────────────────────
  # Downloads the .pkg from every build-pkgs leg (even failed ones — we
  # skip missing downloads), renames each to embed the FreeBSD major for
  # unambiguity, and appends them to the already-published GitHub Release.
  #
  # DEPENDENCY EDGES: sync-ports-fork needs [prepare-release, release, publish-release]
  # and gates on publish-release succeeding (see build-pkgs-portable's header comment
  # above, "A leg's build failure...", for the full transitive chain from a
  # build-pkgs-portable leg failure through to sync-ports-fork skipping). attach-pkgs
  # here needs [prepare-release, release, build-pkgs-portable, read-matrix] with
  # if: always(), so it runs regardless of a build-pkgs-portable failure.
  #
  # A build-pkgs-portable failure makes attach-pkgs skip that leg's artifact but
  # attach the rest (or skip entirely if release also failed).
  attach-pkgs:
    name: Attach .pkg artifacts to Release
    runs-on: ubuntu-latest
    needs: [prepare-release, release, build-pkgs-portable, read-matrix]
    # Run whenever release succeeded AND it was a real publish (not a dry-run);
    # regardless of the build outcome. A build-pkgs-portable failure surfaces as a
    # red leg but does not prevent attach-pkgs from completing with a warning.
    if: always() && needs.release.result == 'success' && needs.release.outputs.dry_run == 'false'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download .pkg artifacts from portable builder
        # Each build-pkgs-portable leg uploads its OWN artifact, named
        # pfBlockerNG-relpkg-fbsd<freebsd_major> (issue #1806); merge every
        # leg's artifact into pkgs/ (each holds exactly one .pkg, already
        # carrying -FreeBSD-<major> in the filename). The pattern also sweeps
        # up each leg's pfBlockerNG-relpkg-deppkgs-fbsd<major> artifact
        # (issue #1806 B1) -- INTENTIONAL: dep .pkgs (e.g. CE's
        # py311-charset-normalizer) are deliberate release assets, frozen
        # alongside the branch .pkgs for the pkg-repo publish + EOL/route-only
        # story. publish-release's healthcheck counts them (EXPECTED_PKGS).
        uses: actions/download-artifact@v4
        with:
          pattern: pfBlockerNG-relpkg-*
          merge-multiple: true
          path: pkgs/
        continue-on-error: true

      - name: Append .pkg files to the GitHub Release
        # Upload the renamed .pkg files to the still-DRAFT release using
        # `gh release upload` (the release is published later by publish-release —
        # immutable-release repos only accept assets while the release is a draft).
        # This is idempotent: re-uploading an asset with --clobber replaces it. If
        # pkgs/ has no .pkg files (all builds failed), this step emits a warning and
        # succeeds without uploading anything.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.release.outputs.tag }}
        run: |
          set -eu

          PKGS=$(find pkgs -name "*.pkg" 2>/dev/null | head -20)
          if [ -z "$PKGS" ]; then
            echo "::warning::No .pkg artifacts to attach — the build-pkgs-portable leg may have failed."
            echo "Check the build-pkgs-portable job logs for details."
            exit 0
          fi

          # Recurse: each build-pkgs-portable leg uploads its own single-file
          # artifact, and merge-multiple downloads them all flat under pkgs/ --
          # a non-recursive pkgs/*.pkg glob would already find them, but find
          # -type f is used here (and above) to stay robust either way.
          find pkgs -type f -name "*.pkg" -print0 | while IFS= read -r -d '' f; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "All .pkg artifacts attached to release ${TAG}"

  # ── 2c2. Health-check, then publish the draft Release (the FINAL, gated step) ──
  # The release was created as a DRAFT (immutable-release repos freeze assets at
  # publish time, so the source archive + every .pkg must be uploaded to the draft
  # FIRST — done by `release` + `attach-pkgs`). Publishing is the LAST, irreversible
  # action: it emits release.published and locks the release immutable. So we GATE it
  # on a healthcheck that the draft is complete — the source archive AND exactly one
  # .pkg per build-matrix entry are attached, and the name/body are non-empty. A failed
  # build (missing .pkg) FAILS the healthcheck and the release STAYS A DRAFT, never a
  # half-published immutable release; re-running the flow then resumes that same draft.
  publish-release:
    name: Health-check + publish the draft Release
    runs-on: ubuntu-latest
    needs: [prepare-release, release, attach-pkgs, read-matrix]
    # ADR-14 D1 / issue #1662: the publish flip waits on EVERY live gate — since
    # issue #1855 it does so TRANSITIVELY and there is exactly ONE seam for that
    # rule: tag-release. release needs tag-release, attach-pkgs needs release, and
    # this job needs attach-pkgs, so nothing here can run unless both suite
    # AND-gates were green (or, for an alpha/beta, were legitimately not required).
    # Duplicating the suite conditions here would be a second copy of the Part 3
    # predicate to drift; tests/test_release_tag_after_verify.py walks the graph
    # instead. A flaky leg still re-runs in isolation without redoing the publish.
    if: always() && needs.release.result == 'success' && needs.attach-pkgs.result == 'success' && needs.read-matrix.result == 'success' && needs.release.outputs.dry_run == 'false'
    permissions:
      contents: write
    steps:
      - name: Health-check the draft release is complete
        # Verify completeness BEFORE the irreversible publish. Expected assets: the
        # source archive + exactly one .pkg per build-matrix entry (one per distinct
        # FreeBSD major, issue #1806) PLUS one dep .pkg per extra_pkgs entry across
        # every (deduped) build-matrix row (issue #1806 B1: attach-pkgs's
        # pfBlockerNG-relpkg-* sweep also picks up each major's
        # pfBlockerNG-relpkg-deppkgs-fbsd<major> artifact -- a deliberate release
        # asset, not a leak). Anything missing → fail, leaving the draft intact for
        # a resume. Already-published (idempotent re-run) short-circuits OK.
        env:
          GH_TOKEN:     ${{ github.token }}
          TAG:          ${{ needs.release.outputs.tag }}
          BUILD_MATRIX: ${{ needs.read-matrix.outputs.build_matrix }}
        run: |
          set -eu
          REPO="${{ github.repository }}"

          META=$(gh release view "$TAG" --repo "$REPO" --json isDraft,name,body,assets)
          IS_DRAFT=$(printf '%s' "$META" | jq -r '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release ${TAG} is already published — nothing to verify (idempotent re-run)."
            exit 0
          fi

          # issue #1806 B1: the distinct-major count PLUS the total number of
          # extra_pkgs entries across the (deduped) build-matrix rows -- each
          # dep .pkg is its own release asset (see attach-pkgs's comment).
          EXPECTED_PKGS=$(printf '%s' "$BUILD_MATRIX" | jq '(length) + ([.[] | (.extra_pkgs // []) | length] | add // 0)')
          PKG_COUNT=$(printf '%s' "$META" | jq '[.assets[] | select(.name | endswith(".pkg"))] | length')
          SRC_COUNT=$(printf '%s' "$META" | jq '[.assets[] | select(.name | endswith(".tar.gz"))] | length')

          echo "Draft assets:"
          printf '%s' "$META" | jq -r '.assets[].name' | sort | sed 's/^/  - /'
          echo "Expected .pkg: ${EXPECTED_PKGS} | found .pkg: ${PKG_COUNT} | source archives: ${SRC_COUNT}"

          FAIL=0
          [ "$SRC_COUNT" -ge 1 ] || { echo "::error::no source archive (.tar.gz) attached to the draft"; FAIL=1; }
          [ "$EXPECTED_PKGS" -ge 1 ] || { echo "::error::build matrix is empty"; FAIL=1; }
          [ "$PKG_COUNT" -eq "$EXPECTED_PKGS" ] || { echo "::error::expected ${EXPECTED_PKGS} .pkg assets, found ${PKG_COUNT} — not publishing an incomplete release"; FAIL=1; }
          printf '%s' "$META" | jq -e '(.name // "") != "" and ((.body // "") | length) > 0' >/dev/null \
            || { echo "::error::release name or body is empty"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || exit 1
          echo "Healthcheck passed — draft ${TAG} is complete and safe to publish."

      - name: Publish (flip draft → published) — the final, irreversible step
        env:
          GH_TOKEN:   ${{ github.token }}
          TAG:        ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release ${TAG} already published — nothing to do (idempotent)."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then PRE_FLAG="--prerelease"; else PRE_FLAG="--latest"; fi
          # Recompute the ISO date prefix at PUBLISH time so the title reflects the actual publish
          # date, not the draft-creation date: a run crossing midnight UTC, or a draft resumed and
          # published on a later day (the "resume a prior draft" path), would otherwise keep the
          # stale draft-creation date. Rewrite only the leading "YYYY-MM-DD - "; the
          # "<version> — <summary>" tail is preserved. Done BEFORE the flip so a rewrite failure
          # leaves a resumable draft, never a published release with a stale/bad title.
          CUR_NAME=$(gh release view "$TAG" --repo "$REPO" --json name --jq '.name')
          NEW_NAME="$(date -u +%Y-%m-%d) - $(printf '%s' "$CUR_NAME" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2} - //')"
          if [ "$NEW_NAME" != "$CUR_NAME" ]; then
            gh release edit "$TAG" --repo "$REPO" --title "$NEW_NAME"
            echo "Retitled with publish date: ${CUR_NAME} -> ${NEW_NAME}"
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false $PRE_FLAG
          echo "Published release ${TAG} (prerelease=${PRERELEASE})."

  # ── 2d. Poke the self-hosted pkg repository to republish (ADR-17) ──────────
  # The pkg catalog is hosted + deployed by the SEPARATE pfBlockerNG/pkg repo:
  # its own publish.yml enumerates this repo's Releases (the durable store),
  # CONSUMES the Release .pkg assets for the release/<varver>/ subtree (arch-less;
  # issue #1806 — devel = latest prerelease, stable = latest stable; nightly still
  # built from devel HEAD),
  # and deploys to its OWN GitHub Pages via same-repo OIDC — no cross-repo deploy key.
  # On a release we just trigger it so the new Release appears at
  # pfblockerng.github.io/pkg within seconds (its daily schedule is the backstop).
  # ORDERING: this needs [release, attach-pkgs, publish-release] — the consume run
  # enumerates this repo's PUBLISHED Releases and downloads their assets, so the
  # release must be fully attached, healthchecked, AND flipped to published first.
  # publish-release only publishes a COMPLETE draft (healthcheck), so by the time this
  # fires the published release carries every expected .pkg.
  # ISOLATED — sync-ports-fork does NOT `needs:` this, so a failure here can NEVER gate or
  # break release / sync-ports-fork / attach-pkgs.
  # ORDERED AFTER sync-ports-fork — pfBlockerNG/pkg's publish.yml derives the NIGHTLY version
  # from the `-nightly` port's PORTVERSION in the FreeBSD-ports fork, which sync-ports-fork
  # bumps. If this dispatch raced sync-ports-fork, the pkg repo read the OLD PORTVERSION and
  # shipped a stale-versioned nightly (e.g. 4.0.0.alpha.3.* on the alpha.4 commit). Waiting for
  # sync-ports-fork guarantees the bump has landed before the pkg repo reads it. The retained
  # `always()` keeps this running even if sync-ports-fork fails — it ORDERS, never hard-gates;
  # the `if` still requires the release itself to have published.
  repo-publish:
    name: Trigger pkg repository publish
    runs-on: ubuntu-latest
    needs: [prepare-release, release, attach-pkgs, publish-release, sync-ports-fork]
    if: always() && needs.release.result == 'success' && needs.publish-release.result == 'success' && needs.release.outputs.dry_run == 'false'
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKG_GITHUB_APP_ID }}
          private-key: ${{ secrets.PKG_GITHUB_APP_PRIVATE_KEY }}
          owner: pfBlockerNG
          repositories: pkg
          permission-actions: write

      - name: Dispatch pfBlockerNG/pkg publish.yml
        # GitHub App scoped to pfBlockerNG/pkg with Actions:write — only enough to
        # start a workflow there (cannot push code).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run publish.yml -R pfBlockerNG/pkg

  # ── 3. Sync the port on our FreeBSD-ports fork (pfblockerng/use-github) ─────
  # Self-hosted distribution (ADR-17): we do NOT PR the upstream pfsense ports
  # tree. Bump the matching port's PORTVERSION directly on our own
  # fork's build-input branch (pfblockerng/use-github) — the SAME branch every
  # build reads (release.yml build-pkgs-portable, pfBlockerNG/pkg publish.yml) —
  # so the fork's port stays in lockstep with each release. Direct push: it's our
  # branch, no PR. A no-op bump (version unchanged) just exits. Gated on
  # publish-release so the public port only advances once the release is definitively
  # published (healthcheck passed) — never for a draft that failed to complete.
  sync-ports-fork:
    name: Sync port on FreeBSD-ports fork
    runs-on: ubuntu-latest
    needs: [prepare-release, release, publish-release]
    if: always() && needs.publish-release.result == 'success' && needs.release.outputs.dry_run == 'false'
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token (FreeBSD-ports)
        id: ports-token
        # Mint a short-lived installation token from the PKG GitHub App, scoped to
        # pfBlockerNG/FreeBSD-ports with Contents:write — the same App used by
        # repo-publish, no standalone PAT to rotate. REQUIRES the App to be installed
        # on FreeBSD-ports with Contents:write; if it is not, this step fails loudly
        # ('not installed on ... repositories' / permission error) — the clear signal
        # to grant it, rather than a confusing empty-token checkout failure.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKG_GITHUB_APP_ID }}
          private-key: ${{ secrets.PKG_GITHUB_APP_PRIVATE_KEY }}
          owner: pfBlockerNG
          repositories: FreeBSD-ports
          permission-contents: write

      - name: Checkout the FreeBSD-ports fork (use-github branch)
        uses: actions/checkout@v6
        with:
          repository: pfBlockerNG/FreeBSD-ports
          ref: pfblockerng/use-github
          token: ${{ steps.ports-token.outputs.token }}
          persist-credentials: true   # need to push the PORTVERSION bump via the App token
          # Minimal clone: the bump only edits the port Makefile(s), then commits + pushes.
          # Shallow (depth-1) + blobless + sparse to the bumped port dirs avoids cloning the
          # full ~1.3 GB ports tree. The commit is a fast-forward the remote accepts; the
          # push-reject rebase retry below reaches the racing tip via an on-demand fetch.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            net/pfSense-pkg-pfBlockerNG
            net/pfSense-pkg-pfBlockerNG-devel
            net/pfSense-pkg-pfBlockerNG-nightly
          sparse-checkout-cone-mode: true

      - name: Checkout pfBlockerNG (scripts only — sparse)
        uses: actions/checkout@v6
        with:
          repository: pfBlockerNG/pfBlockerNG
          ref: ${{ needs.release.outputs.tag }}
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
          path: pfblockerng-src
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump PORTVERSION and push to use-github
        # branch/version ride in via env (NOT inline ${{ }}) so a crafted tag can't
        # template-inject into this shell.
        env:
          BRANCH:      ${{ needs.release.outputs.branch }}
          TAG:         ${{ needs.release.outputs.tag }}              # e.g. v4.0.0.alpha.1 | v4.0.0
          PORTVERSION: ${{ needs.release.outputs.portversion }}  # e.g. 4.0.0.alpha.1 | 4.0.0 (pkg-safe)
        run: |
          set -eu
          # PORTVERSION is already classified + pkg-safe (no '-') by release-version.sh
          # in the `release` job; re-assert the shape here as belt-and-braces so a
          # malformed value can never reach the Makefile.
          if [ "$BRANCH" = "devel" ]; then
            printf '%s' "$PORTVERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(alpha|beta|rc)\.[1-9][0-9]*$' || {
              echo "::error::invalid devel PORTVERSION/tag: ${TAG}"; exit 1; }
          else
            printf '%s' "$PORTVERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
              echo "::error::invalid stable PORTVERSION/tag: ${TAG}"; exit 1; }
          fi

          # A devel release bumps TWO ports in lockstep: the -devel port (the Netgate
          # devel package) AND the -nightly port. publish.yml (pfBlockerNG/pkg) derives
          # the nightly base version from the -nightly port's PORTVERSION, so unless it
          # advances together with -devel the nightlies stay pinned to a stale version
          # and sort BELOW the current prerelease (e.g. 3.2.16.* < 4.0.0.alpha.2). They
          # share an identical pkg-plist, differing only in PORTNAME/CONFLICTS/GH_ACCOUNT,
          # so the version edit is the only thing to keep in sync. Both are committed in
          # ONE commit so the two ports can never diverge. Stable touches only its port.
          if [ "$BRANCH" = "devel" ]; then
            PORT_PATHS="net/pfSense-pkg-pfBlockerNG-devel net/pfSense-pkg-pfBlockerNG-nightly"
            PORTS_LABEL="net/pfSense-pkg-pfBlockerNG-{devel,nightly}"
          else
            PORT_PATHS="net/pfSense-pkg-pfBlockerNG"
            PORTS_LABEL="net/pfSense-pkg-pfBlockerNG"
          fi

          for PORT_PATH in $PORT_PATHS; do
            MAKEFILE="${PORT_PATH}/Makefile"

            # Read the current PORTVERSION and PORTREVISION from the Makefile before
            # editing, so the compare-and-bump helper can decide whether to increment
            # or reset.  Absent PORTREVISION is treated as 0 by the helper.
            OLD_PORTVERSION="$(grep -m1 '^PORTVERSION=' "$MAKEFILE" | sed 's/^PORTVERSION=[[:space:]]*//')"
            if [ -z "${OLD_PORTVERSION}" ]; then
              echo "::error::PORTVERSION not found in ${MAKEFILE}"
              exit 1
            fi
            OLD_PORTREVISION="$(grep -m1 '^PORTREVISION=' "$MAKEFILE" | sed 's/^PORTREVISION=[[:space:]]*//')" || true

            # Auto-detect rebuild: same PORTVERSION → bump PORTREVISION; different → 0.
            # Logic is extracted into scripts/portrevision-rebuild.sh for testability.
            NEW_PORTREVISION="$(sh "${GITHUB_WORKSPACE}/pfblockerng-src/scripts/portrevision-rebuild.sh" \
              "${OLD_PORTVERSION}" "${OLD_PORTREVISION}" "${PORTVERSION}")"

            # Update PORTVERSION only. GH_TAGNAME is `v${PORTVERSION}` in the Makefile,
            # so it self-resolves to the matching tag — the workflow never sets it.
            sed -i \
              -e "s/^PORTVERSION=.*/PORTVERSION=\t${PORTVERSION}/" \
              "$MAKEFILE"

            # Apply PORTREVISION per ports convention: remove when 0; set/insert after
            # PORTVERSION when > 0.  The sed removes any existing line first, then the
            # PORTVERSION line is used as an anchor to insert the new one.
            sed -i -e "/^PORTREVISION=/d" "$MAKEFILE"
            if [ "${NEW_PORTREVISION}" -gt 0 ]; then
              sed -i -e "s/^PORTVERSION=.*/&\nPORTREVISION=\t${NEW_PORTREVISION}/" "$MAKEFILE"
            fi

            git add "$MAKEFILE"
          done

          # ONE atomic commit for every bumped port — devel + nightly move together.
          if git diff --cached --quiet; then
            echo "${PORTS_LABEL} already at ${PORTVERSION} (${TAG}) — nothing to push."
            exit 0
          fi
          git commit -m "$(printf '%s: update to %s\n\npfBlockerNG/pfBlockerNG release %s.' \
            "$PORTS_LABEL" "$PORTVERSION" "$TAG")"

          # use-github only advances via releases; push directly, rebasing once on a
          # racing update.
          n=0
          until git push origin HEAD:pfblockerng/use-github; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::could not push the port bump to use-github after ${n} attempts"
              exit 1
            fi
            echo "push rejected — rebasing on the latest use-github (attempt ${n})"
            git pull --rebase origin pfblockerng/use-github
          done
          echo "Pushed ${PORTS_LABEL} ${PORTVERSION} (${TAG}) to pfblockerng/use-github"
