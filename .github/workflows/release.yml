name: Release

# Triggered when a versioned tag (v*) is pushed to any branch.
# Tags pushed from 'devel' become pre-releases; tags from 'main' become
# full releases.  After publishing the GitHub Release, the matching port's
# PORTVERSION + GH_TAGNAME are bumped directly on our own FreeBSD-ports fork
# (pfBlockerNG/FreeBSD-ports @ pfblockerng/use-github) — the build-input branch.
# Self-hosted distribution (ADR-17): no upstream pfsense/FreeBSD-ports PR.
#
# workflow_dispatch allows a dry-run (point at an existing tag via
# workflow_dispatch + the tag ref).
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

# Least-privilege default; jobs that need more elevate explicitly below
# (release: contents:write to publish; verify-checks: checks:read to read the
# tagged commit's check runs; ui-suite: packages:read to pull the pfSense image
# from private GHCR). sync-ports-fork operates on the FreeBSD-ports fork via
# PORTS_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read
  packages: read

jobs:
  # ── 1. Verify ────────────────────────────────────────────────────────────
  verify-checks:
    name: Verify commit checks passed
    runs-on: ubuntu-latest
    permissions:
      checks: read   # read the tagged commit's check-runs via gh api
    steps:
      - name: Check 'All tests passed' status for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          CONCLUSION=$(gh api \
            "repos/${REPO}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "All tests passed")]
                  | sort_by(.completed_at) | last | .conclusion // "not_found"')

          if [ "$CONCLUSION" != "success" ]; then
            echo "Error: 'All tests passed' for ${SHA} is '${CONCLUSION}'."
            echo "Push the commit to a branch first and wait for CI to pass before tagging."
            exit 1
          fi

  # ── 1b. UI suite (ADR-14, D1) ────────────────────────────────────────────
  # Run the FULL tiered Web-UI suite on the live pfSense VM BEFORE publishing.
  # `tier: all` expands the reusable workflow's matrix to one GH job per
  # (tier × version) leg — render / functional / browser × each image — and
  # `fail-fast: false` keeps every leg independent. Because each leg is its own
  # job, GitHub's "Re-run failed jobs" re-runs ONLY a flaky leg; `release` and
  # `sync-ports-fork` do NOT re-run until all legs are green again (they only run once
  # their `needs:` are all `success`), so a not-our-fault browser flake costs a
  # single-leg re-run, never a republish.
  #
  # This is a SEPARATE gate ALONGSIDE verify-checks (which still asserts the "All
  # tests passed" PR-time check, covering the Tier-A PR fold). It does not weaken
  # that gate — the release `needs:` BOTH.
  #
  # §7 browser DEMOTE/DROP — one-line switch: the browser leg is included here as
  # a separate re-runnable leg (the cheap tiers gate firmly; browser adds the
  # JS/screenshot coverage). Per ADR §7, if the first CI evidence misses the
  # reliability threshold (≥ 4/5 clean at ≤ ~25 min/leg), demote it out of the
  # release gate by dropping `browser` from DEFAULT_SCHEDULE_TIERS in ui-tests.yml
  # AND running this with `tier: functional` instead of `tier: all` here — the
  # render + functional legs keep gating the release, the browser leg goes
  # dispatch-only. Tier A + B-HTTP retain full standalone value.
  # TEMPORARILY DISABLED (if: false) — the live-VM UI harness is still being
  # stabilized (ADR-14 §7; login fixed in #81, page-serving 404 + php_error.log
  # size read outstanding). While it cannot pass, it must not gate or burden a
  # release. Re-enable by removing `if: false` here AND re-adding `ui-suite` to
  # the `release` job's `needs:` below, once the harness runs green.
  ui-suite:
    name: UI suite (live pfSense VM)
    if: false
    uses: ./.github/workflows/ui-tests.yml
    with:
      tier: all
    secrets: inherit

  # ── 1c. Read version matrix ──────────────────────────────────────────────
  # Read the supported-versions matrix from ci-metadata and compute a
  # deduped build matrix (one entry per distinct FreeBSD major — one .pkg
  # per ABI). Runs in parallel with verify-checks; build-pkgs needs both.
  read-matrix:
    name: Read version matrix
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.dedupe.outputs.build_matrix }}
      pkg_channel: ${{ steps.channel.outputs.pkg_channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history to reach ci-metadata ref and tag

      - name: Detect pkg channel from tag
        id: channel
        # Tags from devel are *-devel; tags from main have no -devel suffix.
        # The channel drives which port we build: devel or stable.
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-devel) PKG_CHANNEL="devel" ;;
            *)       PKG_CHANNEL="stable" ;;
          esac
          echo "pkg_channel=${PKG_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}  →  pkg channel: ${PKG_CHANNEL}"

      - name: Read matrix from ci-metadata
        id: matrices
        uses: ./.github/actions/read-version-matrix

      - name: Dedupe build matrix by freebsd_major + arch
        id: dedupe
        # For each distinct (freebsd_major, arch), select the first CE entry
        # (preferred); if no CE entry exists for that pair, fall back to the first
        # Plus entry. Result: one build entry per distinct FreeBSD major × arch — so
        # an aarch64 entry (Plus-only, issue #199) produces its own .pkg alongside
        # the amd64 build — fed to the portable builder's inline loop
        # (build-pkgs-portable). The reader resolves `arch` (default amd64) on every
        # entry, so a matrix with no aarch64 entry dedupes exactly as before.
        run: |
          DEDUPED=$(printf '%s' '${{ steps.matrices.outputs.build_matrix }}' \
            | jq -c '
                group_by([.freebsd_major, .arch])
                | map(
                    (map(select(.channel == "CE")) | first)
                    // first
                  )
              ')
          printf 'build_matrix=%s\n' "$DEDUPED" >> "$GITHUB_OUTPUT"
          echo "Deduped build matrix: $DEDUPED"

  # ── 2. Release ───────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Gate the publish on the PR-time aggregate (verify-checks). The live-VM UI
    # suite (ui-suite) is TEMPORARILY un-gated (see its `if: false` above) while
    # the ADR-14 harness is stabilized; re-add `ui-suite` here once it is green.
    needs: verify-checks
    permissions:
      contents: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      branch: ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history for changelog

      - name: Gather release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Determine which branch this tag was created from
          BRANCH=$(git branch -r --contains "$TAG" \
            | grep -v HEAD \
            | sed 's|origin/||' \
            | grep -E '^(main|devel)$' \
            | head -1)
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # Enforce tag naming convention per branch
          case "$BRANCH" in
            devel)
              case "$TAG" in
                *-devel) ;;
                *) echo "Error: tags from 'devel' must match vX.X.X-devel (got '${TAG}')"; exit 1 ;;
              esac
              ;;
            main)
              case "$TAG" in
                *-devel) echo "Error: tags from 'main' must not have -devel suffix (got '${TAG}')"; exit 1 ;;
              esac
              ;;
          esac

          # Tags from 'devel' are pre-releases
          if [ "$BRANCH" = "devel" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous tag on the same branch
        id: prev_tag
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"
          CURRENT="${GITHUB_REF_NAME}"

          # All tags reachable from this branch, sorted by version descending,
          # excluding the current tag
          PREV=$(git tag --sort=-version:refname \
            | grep -v "^${CURRENT}$" \
            | while read t; do
                git merge-base --is-ancestor "$t" "origin/${BRANCH}" 2>/dev/null \
                  && echo "$t" && break
              done)

          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          PREV="${{ steps.prev_tag.outputs.tag }}"

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${CURRENT}"
            HEADER="Changes since ${PREV}"
          else
            RANGE="${CURRENT}"
            HEADER="Initial release"
          fi

          BODY=$(git log "$RANGE" \
            --pretty=format:"- %s" \
            --no-merges \
            -- \
            src/ scripts/ \
            | head -50)

          {
            echo "body<<EOF"
            echo "## ${HEADER}"
            echo ""
            echo "${BODY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build source archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.meta.outputs.version }}"
          ARCHIVE="pfBlockerNG-${VERSION}.tar.gz"

          # src/ is the production filesystem overlay; dev tooling is outside it
          tar -czf "$ARCHIVE" \
            --exclude="*.pyc" \
            --exclude="__pycache__" \
            src/
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: pfBlockerNG ${{ steps.meta.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: ${{ env.ARCHIVE }}

  # ── 2b. Build .pkg artifacts (portable Linux builder) ────────────────────
  # Builds one .pkg per distinct FreeBSD major from the deduped matrix.
  # Runs the portable Linux builder steps inline (no FreeBSD VM, ~3 min/entry).
  # This is the SOLE release .pkg builder: pfBlockerNG is a NO_BUILD port, so the
  # portable builder reproduces `make package` byte-for-byte (validated against it
  # over every smoke + Web-UI run on CE and Plus) and `pkg add` checks a dep is
  # PRESENT, not its version — so the portable artifact installs identically.
  #
  # GitHub Actions does not allow strategy.matrix on a job that uses a
  # reusable workflow (uses:), so we run each entry sequentially in one job,
  # uploading one artifact per entry with a unique name (pfBlockerNG-pkg-<major>).
  #
  # A build failure surfaces clearly (the job goes red) but MUST NOT break
  # sync-ports-fork: it needs only `release`, never build-pkgs-*.
  # attach-pkgs absorbs the failure with `if: always() && ...` (below).
  build-pkgs-portable:
    name: build .pkg artifacts (portable Linux)
    runs-on: ubuntu-latest
    needs: [verify-checks, read-matrix]
    timeout-minutes: 30

    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure zstd encoder is present
        run: command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zstd; }

      - name: Build one .pkg per FreeBSD major (portable)
        env:
          BUILD_MATRIX: ${{ needs.read-matrix.outputs.build_matrix }}
          PKG_CHANNEL: ${{ needs.read-matrix.outputs.pkg_channel }}
        run: |
          set -eu
          mkdir -p out

          printf '%s\n' "$BUILD_MATRIX" \
            | jq -c '.[]' \
            | while IFS= read -r ENTRY; do
                MAJOR=$(printf '%s\n' "$ENTRY" | jq -r '.freebsd_major')
                FREEBSD_VERSION=$(printf '%s\n' "$ENTRY" | jq -r '.freebsd_version')
                PHP=$(printf '%s\n' "$ENTRY" | jq -r '.php_version')
                PY=$(printf '%s\n' "$ENTRY" | jq -r '.py_flavor')
                ARCH=$(printf '%s\n' "$ENTRY" | jq -r '.arch')
                ABI="FreeBSD:${MAJOR}:${ARCH}"

                echo "--- Building .pkg for FreeBSD ${MAJOR}/${ARCH} (${FREEBSD_VERSION}), PHP ${PHP}, ${PY} ---"

                PORTS_DIR="${RUNNER_TEMP}/ports-${MAJOR}-${ARCH}"
                git clone --depth 1 -b pfblockerng/use-github \
                  "https://github.com/pfBlockerNG/FreeBSD-ports" \
                  "$PORTS_DIR"

                PKG_OUT="out/major-${MAJOR}-${ARCH}"
                mkdir -p "$PKG_OUT"
                python3 scripts/build-pkg-portable.py \
                  --ports "$PORTS_DIR" \
                  --channel "$PKG_CHANNEL" \
                  --local-src . \
                  --abi "$ABI" \
                  --py-flavor "$PY" \
                  --php "$PHP" \
                  --out "$PKG_OUT"

                echo "Built for FreeBSD ${MAJOR}/${ARCH}:"
                ls -l "${PKG_OUT}"/*.pkg

                # Rename to embed FreeBSD major + arch before upload (two arches of
                # one major must not collide on a shared -FreeBSD-<major>.pkg name).
                for f in "${PKG_OUT}"/*.pkg; do
                  [ -f "$f" ] || continue
                  BASE=$(basename "$f" .pkg)
                  mv "$f" "${PKG_OUT}/${BASE}-FreeBSD-${MAJOR}-${ARCH}.pkg"
                  echo "Renamed: $(basename "$f") -> ${BASE}-FreeBSD-${MAJOR}-${ARCH}.pkg"
                done
              done

          echo "All .pkg artifacts:"
          find out -name "*.pkg" -exec ls -l {} \;

      - name: Upload .pkg artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pfBlockerNG-release-pkgs
          path: out/**/*.pkg
          if-no-files-found: error
          retention-days: 7

  # ── 2c. Attach .pkg artifacts to the GitHub Release ──────────────────────
  # Downloads the .pkg from every build-pkgs leg (even failed ones — we
  # skip missing downloads), renames each to embed the FreeBSD major for
  # unambiguity, and appends them to the already-published GitHub Release.
  #
  # DEPENDENCY EDGES — WHY sync-ports-fork IS INTACT:
  #   sync-ports-fork needs: [release]         ← never needs build-pkgs
  #   attach-pkgs needs: [release, build-pkgs] ← waits for both, if: always()
  #
  # A build-pkgs failure makes attach-pkgs skip that leg's artifact but
  # attach the rest (or skip entirely if release also failed). sync-ports-fork is
  # completely unblocked by any build outcome — it runs as soon as `release`
  # succeeds, in parallel with attach-pkgs.
  attach-pkgs:
    name: Attach .pkg artifacts to Release
    runs-on: ubuntu-latest
    needs: [release, build-pkgs-portable, read-matrix]
    # Run whenever release succeeded, regardless of the build outcome. A
    # build-pkgs-portable failure surfaces as a red leg but does not prevent
    # attach-pkgs from completing with a warning if nothing built.
    if: always() && needs.release.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download .pkg artifacts from portable builder
        # The portable builder uploads as "pfBlockerNG-release-pkgs"; each artifact
        # already has -FreeBSD-<major> in the filename (renamed before upload).
        uses: actions/download-artifact@v4
        with:
          name: pfBlockerNG-release-pkgs
          path: pkgs/
        continue-on-error: true

      - name: Append .pkg files to the GitHub Release
        # Upload the renamed .pkg files to the already-published release using
        # `gh release upload`. This is idempotent: re-uploading an asset with
        # --clobber replaces it. If pkgs/ has no .pkg files (all builds failed),
        # this step emits a warning and succeeds without uploading anything.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"

          PKGS=$(find pkgs -name "*.pkg" 2>/dev/null | head -20)
          if [ -z "$PKGS" ]; then
            echo "::warning::No .pkg artifacts to attach — the build-pkgs-portable leg may have failed."
            echo "Check the build-pkgs-portable job logs for details."
            exit 0
          fi

          # Recurse: the portable builder uploads under out/major-<N>/, so the
          # artifact downloads to pkgs/out/major-<N>/*.pkg (nested) — a flat
          # pkgs/*.pkg glob would match nothing. Mirror the find above.
          find pkgs -type f -name "*.pkg" -print0 | while IFS= read -r -d '' f; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "All .pkg artifacts attached to release ${TAG}"

  # ── 2d. Poke the self-hosted pkg repository to republish (ADR-17) ──────────
  # The pkg catalog is hosted + deployed by the SEPARATE pfBlockerNG/pkg repo:
  # its own publish.yml enumerates this repo's Releases (the durable store),
  # rebuilds the per-ABI catalog, and deploys to its OWN GitHub Pages via
  # same-repo OIDC — no cross-repo deploy key. On a release we just trigger it so
  # the new Release appears at pfblockerng.github.io/pkg within seconds (its daily
  # schedule is the backstop).
  # ADDITIVE + ISOLATED — wired like attach-pkgs: sync-ports-fork / attach-pkgs do
  # NOT `needs:` this, and this only `needs: [release]`, so a failure here can NEVER
  # gate or break release / sync-ports-fork / attach-pkgs.
  repo-publish:
    name: Trigger pkg repository publish
    runs-on: ubuntu-latest
    needs: [release]
    if: always() && needs.release.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKG_GITHUB_APP_ID }}
          private-key: ${{ secrets.PKG_GITHUB_APP_PRIVATE_KEY }}
          owner: pfBlockerNG
          repositories: pkg
          permission-actions: write

      - name: Dispatch pfBlockerNG/pkg publish.yml
        # GitHub App scoped to pfBlockerNG/pkg with Actions:write — only enough to
        # start a workflow there (cannot push code).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run publish.yml -R pfBlockerNG/pkg

  # ── 2e. Redeploy the Cloudflare routing Worker (ADR-20) ─────────────────────
  # The Worker reads routing.json from Pages and 302-redirects pkg to the
  # correct variant catalog.  Redeployed on every release so the live Worker
  # always matches the current wrangler.toml / source.  ADDITIVE + ISOLATED —
  # same pattern as repo-publish: only needs: [release], never blocks sync-ports-fork.
  deploy-worker:
    name: Deploy Cloudflare routing Worker
    needs: [release]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/deploy-worker.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 3. Sync the port on our FreeBSD-ports fork (pfblockerng/use-github) ─────
  # Self-hosted distribution (ADR-17): we do NOT PR the upstream pfsense ports
  # tree. Bump the matching port's PORTVERSION + GH_TAGNAME directly on our own
  # fork's build-input branch (pfblockerng/use-github) — the SAME branch every
  # build reads (release.yml build-pkgs-portable, pfBlockerNG/pkg publish.yml) —
  # so the fork's port stays in lockstep with each release. Direct push: it's our
  # branch, no PR. A no-op bump (version unchanged) just exits.
  sync-ports-fork:
    name: Sync port on FreeBSD-ports fork
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read

    steps:
      - name: Checkout the FreeBSD-ports fork (use-github branch)
        uses: actions/checkout@v6
        with:
          repository: pfBlockerNG/FreeBSD-ports
          ref: pfblockerng/use-github
          token: ${{ secrets.PORTS_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump PORTVERSION + GH_TAGNAME and push to use-github
        run: |
          set -eu
          BRANCH="${{ needs.release.outputs.branch }}"
          VERSION="${{ needs.release.outputs.version }}"   # e.g. 3.2.16-devel | 3.2.16
          TAG="v${VERSION}"
          # PORTVERSION must be pkg-safe (no '-'): the channel lives in the port's
          # PKGNAMESUFFIX, not the version. Strip a trailing -devel.
          PORTVERSION="${VERSION%-devel}"

          if [ "$BRANCH" = "devel" ]; then
            PORT_PATH="net/pfSense-pkg-pfBlockerNG-devel"
          else
            PORT_PATH="net/pfSense-pkg-pfBlockerNG"
          fi
          MAKEFILE="${PORT_PATH}/Makefile"

          # PORTVERSION = the numeric version; GH_TAGNAME = the actual release tag
          # (so a real `make package` fetch resolves it); drop PORTREVISION.
          sed -i \
            -e "s/^PORTVERSION=.*/PORTVERSION=\t${PORTVERSION}/" \
            -e "s|^GH_TAGNAME=.*|GH_TAGNAME=\t${TAG}|" \
            -e "/^PORTREVISION=/d" \
            "$MAKEFILE"

          if git diff --quiet -- "$MAKEFILE"; then
            echo "${PORT_PATH} already at ${PORTVERSION} (${TAG}) — nothing to push."
            exit 0
          fi
          git add "$MAKEFILE"
          git commit -m "$(printf '%s: update to %s\n\nGH_TAGNAME=%s — pfBlockerNG/pfBlockerNG release.' \
            "$PORT_PATH" "$PORTVERSION" "$TAG")"

          # use-github only advances via releases; push directly, rebasing once on a
          # racing update.
          n=0
          until git push origin HEAD:pfblockerng/use-github; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::could not push the port bump to use-github after ${n} attempts"
              exit 1
            fi
            echo "push rejected — rebasing on the latest use-github (attempt ${n})"
            git pull --rebase origin pfblockerng/use-github
          done
          echo "Pushed ${PORT_PATH} ${PORTVERSION} (${TAG}) to pfblockerng/use-github"
