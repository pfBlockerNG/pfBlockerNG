name: Trigger pkg repository republish

# Manual dispatch that re-runs the SAME publish-pkg-repo.sh flow
# release-published.yml's publish-pkg-repo job runs on a release, for a Release
# already published. Two uses: republish the self-hosted pkg catalog on demand
# (e.g. after a catalogue-side fix), and verify the GitHub App credentials work — a
# FAILED run means the App ID / private key is missing, misconfigured, or lacks
# Contents:write on pfBlockerNG/pkg. issue #2146: there is no workflow in
# pfBlockerNG/pkg any more — this run does the verify + assemble + commit + push
# itself, exactly like release-published.yml's job.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable source Release id
        required: true
        type: string
      release_tag:
        description: Immutable source Release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the pkg catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable source Release identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          [ -n "$RELEASE_ID" ] || { echo "::error::release_id is required"; exit 1; }
          [ -n "$RELEASE_TAG" ] || { echo "::error::release_tag is required"; exit 1; }
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo "::error::release_id must be a decimal GitHub Release id"; exit 1 ;;
          esac
          RELEASE_JSON=$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}")
          ACTUAL_TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          RELEASE_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')
          RELEASE_PRERELEASE=$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')
          [ "$ACTUAL_TAG" = "$RELEASE_TAG" ] || {
            echo "::error::release ${RELEASE_ID} is not tagged ${RELEASE_TAG}"; exit 1;
          }
          [ "$RELEASE_DRAFT" = "false" ] || {
            echo "::error::release ${RELEASE_ID} is still a draft"; exit 1;
          }
          # Same identity check release-published.yml makes. This step runs before the
          # checkout, so the tag shape stands in for the canonical parse: every tag that
          # survives derive_destinations_from_git below is vX.Y.Z or vX.Y.Z.<stage><n>,
          # and only the latter is a prerelease. A malformed tag fails there instead.
          case "$RELEASE_TAG" in
            *.*.*.*) EXPECTED_PRERELEASE=true ;;
            *) EXPECTED_PRERELEASE=false ;;
          esac
          [ "$RELEASE_PRERELEASE" = "$EXPECTED_PRERELEASE" ] || {
            echo "::error::release ${RELEASE_ID} prerelease flag does not match ${RELEASE_TAG}"; exit 1;
          }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive destinations from the exact Release tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          git fetch origin --tags --force '+refs/heads/release/*:refs/remotes/origin/release/*'
          SOURCE_LINE=$(python3 - "$RELEASE_TAG" <<'PY'
          import sys

          from scripts.release_version import parse_release_tag, primary_channel_for_tag

          tag = sys.argv[1]
          print(parse_release_tag(tag, primary_channel_for_tag(tag)).release_line)
          PY
          )
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          DESTINATIONS=$(python3 - "$RELEASE_TAG" "$SOURCE_LINE" "$SOURCE_SHA" <<'PY'
          import json
          import sys

          from scripts.release_version import derive_destinations_from_git

          print(json.dumps(list(derive_destinations_from_git(sys.argv[1], sys.argv[2], current_commit=sys.argv[3])), separators=(",", ":")))
          PY
          )
          echo "destinations=${DESTINATIONS}" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token (pkg)
        id: app-token
        # Mint a short-lived installation token from the PKG GitHub App, scoped to
        # pfBlockerNG/pkg with Contents:write — create-github-app-token NARROWS the
        # token to only the permission(s) listed, so contents:write here (not
        # actions:write) is the whole reason the token can push code.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKG_GITHUB_APP_ID }}
          private-key: ${{ secrets.PKG_GITHUB_APP_PRIVATE_KEY }}
          owner: pfBlockerNG
          repositories: pkg
          permission-contents: write

      - name: Checkout pfBlockerNG/pkg
        uses: actions/checkout@v6
        with:
          repository: pfBlockerNG/pkg
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # publish-pkg-repo.sh pushes via this token
          path: pkg-repo
          fetch-depth: 1

      - name: Download release .pkg assets + build the digest sidecar
        # ASSUMED: the GitHub Releases API asset object carries a `digest` field
        # (`sha256:<hex>`) — an INDEPENDENT checksum from the CDN download itself,
        # never recomputed from the same bytes it is meant to check. CI must confirm
        # the live API response actually includes it; a missing digest fails this
        # run closed. publish_release.py reads this sidecar as
        # <assets-dir>/digests.json.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/assets"
          META=$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}")
          PKG_ASSETS=$(printf '%s' "$META" | jq -c '[.assets[] | select(.name | endswith(".pkg"))]')
          [ "$(printf '%s' "$PKG_ASSETS" | jq 'length')" -gt 0 ] || {
            echo "::error::release ${RELEASE_TAG} carries no .pkg assets"; exit 1; }
          BAD=$(printf '%s' "$PKG_ASSETS" | jq '[.[] | select((.digest // "") | startswith("sha256:") | not)] | length')
          [ "$BAD" -eq 0 ] || {
            echo "::error::one or more .pkg release assets have no sha256 digest from the GitHub API"; exit 1; }
          printf '%s' "$PKG_ASSETS" \
            | jq 'map({(.name): (.digest | ltrimstr("sha256:"))}) | add' \
            > "${RUNNER_TEMP}/assets/digests.json"
          gh release download "$RELEASE_TAG" -R "$REPOSITORY" --pattern '*.pkg' --dir "${RUNNER_TEMP}/assets"

      - name: Read the pinned ROUTE matrix
        id: route
        run: |
          set -eu
          git fetch --no-tags --depth 1 origin \
            "+refs/heads/ci-metadata:refs/remotes/origin/ci-metadata"
          ROUTE_MATRIX=$(sh scripts/read-version-matrix.sh --print-route | jq -c .)
          echo "route_matrix=${ROUTE_MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Publish the pkg catalogue
        env:
          PFB_SRC: ${{ github.workspace }}
          PKG_REPO: ${{ github.workspace }}/pkg-repo
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESTINATIONS: ${{ steps.resolve.outputs.destinations }}
          SOURCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
          ASSETS_DIR: ${{ runner.temp }}/assets
          ROUTE_MATRIX: ${{ steps.route.outputs.route_matrix }}
          BASE_URL: https://pfblockerng.github.io/pkg
        run: sh scripts/publish-pkg-repo.sh
