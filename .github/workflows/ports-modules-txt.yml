name: Ports recipe modules

# The Nightly package is built from devel by the recipe on pfBlockerNG/FreeBSD-ports
# `pfblockerng/use-github`, which unpacks GH_TUPLE/GL_TUPLE into go/pfb_dns_gateway/vendor and
# requires its files/modules.txt to equal `go mod vendor`'s byte for byte. A devel PR that moves a
# Go module requirement, or makes the gateway import another package of one, therefore needs a
# follow-up ports change; #3987 merged without one and only the next nightly noticed (fixed by
# FreeBSD-ports#22). This check names that follow-up on the PR (#4007).
on:
  pull_request:
    branches: [devel]
    paths:
      - 'go/**/go.mod'
      - 'go/**/go.sum'
      - 'go/pfb_dns_gateway/**/*.go'
      - '.github/workflows/ports-modules-txt.yml'
      - 'tests/fixtures/ports_modules_txt/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-image:
    # The Go toolchain the other Go gates use (#3852).
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  nightly-modules-txt:
    name: Nightly ports recipe modules.txt matches go mod vendor
    runs-on: ubuntu-latest
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.ci }}
      options: --init
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          check_modules_txt() {  # $1 = the recipe's modules.txt, $2 = go mod vendor's
            cmp -s "$1" "$2" && return 0
            diff -u --label 'FreeBSD-ports nightly files/modules.txt' --label 'go mod vendor (go/pfb_dns_gateway)' "$1" "$2" || true
            echo "::error::go/pfb_dns_gateway's go mod vendor no longer matches the Nightly ports recipe (diff above). Follow-up ports change needed: a pfBlockerNG/FreeBSD-ports PR against pfblockerng/use-github that sets net/pfSense-pkg-pfBlockerNG-nightly/files/modules.txt to this PR's go mod vendor output and moves the matching GH_TUPLE/GL_TUPLE entries in its Makefile (example: pfBlockerNG/FreeBSD-ports#22). This check passes once that change is on pfblockerng/use-github."
            return 1
          }
          # Red canary: #3987's drift (recipe at x/sys v0.49.0, devel vendoring v0.50.0) must fail.
          fixtures=tests/fixtures/ports_modules_txt/issue3987
          if check_modules_txt "$fixtures/ports-nightly-modules.txt" "$fixtures/go-mod-vendor-modules.txt" > /dev/null; then
            echo "::error::red canary: the #3987 modules.txt drift passed the check"
            exit 1
          fi
          work="$(mktemp -d)"
          # The contents API, not raw.githubusercontent.com: its CDN can serve a recipe minutes stale.
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw' \
            -o "$work/ports-modules.txt" \
            'https://api.github.com/repos/pfBlockerNG/FreeBSD-ports/contents/net/pfSense-pkg-pfBlockerNG-nightly/files/modules.txt?ref=pfblockerng/use-github'
          (cd go/pfb_dns_gateway && go mod vendor -o "$work/vendor")
          check_modules_txt "$work/ports-modules.txt" "$work/vendor/modules.txt"
