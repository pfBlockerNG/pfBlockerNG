name: One-shot retag (floating tag migration)

# Temporary workflow — delete after use.
# Copies a GHCR OCI manifest to a new tag (server-side, no data transfer),
# then deletes the old tag version entry.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source tag to copy from"
        required: false
        default: "2.8.1"
      dest_tag:
        description: "Destination floating tag"
        required: false
        default: "2.8"
      delete_source:
        description: "Delete the source tag after copy (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        env:
          SMOKE_GHCR_USER: ${{ secrets.SMOKE_GHCR_USER != '' && secrets.SMOKE_GHCR_USER || github.actor }}
          SMOKE_GHCR_TOKEN: ${{ secrets.SMOKE_GHCR_TOKEN != '' && secrets.SMOKE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$SMOKE_GHCR_TOKEN" | oras login ghcr.io \
            --username "$SMOKE_GHCR_USER" --password-stdin

      - name: Resolve image base ref
        id: ref
        env:
          SMOKE_IMAGE_REPO: ${{ vars.SMOKE_IMAGE_REPO }}
          SMOKE_IMAGE_NAME: ${{ vars.SMOKE_IMAGE_NAME }}
        run: |
          set -eu
          REPO="${SMOKE_IMAGE_REPO:-ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')}"
          IMAGE="${REPO%/}/${SMOKE_IMAGE_NAME:-pfsense-ce}"
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'Image base: %s\n' "$IMAGE"

      - name: Copy manifest to new tag (server-side, no data transfer)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          SOURCE: ${{ inputs.source_tag }}
          DEST: ${{ inputs.dest_tag }}
        run: |
          set -eu
          printf 'Copying %s:%s -> %s:%s\n' "$IMAGE" "$SOURCE" "$IMAGE" "$DEST"
          oras copy "${IMAGE}:${SOURCE}" "${IMAGE}:${DEST}"

          SRC_DIGEST="$(oras resolve "${IMAGE}:${SOURCE}")"
          DST_DIGEST="$(oras resolve "${IMAGE}:${DEST}")"
          printf '  :%s -> %s\n' "$SOURCE" "$SRC_DIGEST"
          printf '  :%s -> %s\n' "$DEST"   "$DST_DIGEST"
          if [ "$SRC_DIGEST" != "$DST_DIGEST" ]; then
            printf '::warning::digests differ — check the copy\n'
          else
            printf 'Digests match: OK\n'
          fi

      - name: Delete source tag version
        if: inputs.delete_source == 'true'
        env:
          GH_TOKEN: ${{ secrets.SMOKE_GHCR_TOKEN != '' && secrets.SMOKE_GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ vars.SMOKE_IMAGE_NAME != '' && vars.SMOKE_IMAGE_NAME || 'pfsense-ce' }}
          SOURCE: ${{ inputs.source_tag }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -eu
          VERSION_ID="$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${ORG}/packages/container/${IMAGE_NAME}/versions" \
            | jq -r --arg tag "$SOURCE" \
              '.[] | select(any(.metadata.container.tags[]; . == $tag)) | .id' \
            | head -1)"

          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "null" ]; then
            printf '::warning::No version found for tag :%s — already deleted?\n' "$SOURCE"
            exit 0
          fi

          printf 'Deleting version %s (tag :%s)...\n' "$VERSION_ID" "$SOURCE"
          curl -sf -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${ORG}/packages/container/${IMAGE_NAME}/versions/${VERSION_ID}"
          printf 'Deleted :%s (version %s)\n' "$SOURCE" "$VERSION_ID"
