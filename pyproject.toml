[tool.pytest.ini_options]
# Run pytest from the repo root; no 'cd' needed in CI or locally.
testpaths = ["tests"]
# --ignore=tests/smoke keeps the default `python -m pytest` byte-for-byte as it
# was before ADR-04 Phase 3: the smoke package (VM fixture, mock feed server,
# its third-party deps) is NEVER imported during default collection, so a
# checkout without tests/smoke/requirements.txt installed still collects
# cleanly and runs the exact same unit set. The smoke workflow re-enables it
# with `pytest -m smoke --override-ini="addopts=" tests/smoke` (or
# `-p no:cacheprovider tests/smoke -m smoke`); see tests/smoke/conftest.py.
addopts   = "-v --ignore=tests/smoke"
markers = [
    "smoke: live-VM end-to-end smoke test (ADR-04); needs KVM + the GHCR pfSense image; deselected from the default run",
    "ui_render: live-VM Web-UI render-smoke (ADR-14 Tier A); authenticated HTTP; deselected from the default run",
    "ui_e2e: live-VM Web-UI functional flow (ADR-14 Tier B, HTTP POST); deselected from the default run",
    "ui_browser: live-VM Web-UI browser/JS test (ADR-14 Tier B, Playwright); deselected from the default run",
    "repo: live-VM release->repository install flow (ADR-17); distinct from -m smoke; deselected from the default run",
    "safesearch: live-VM SafeSearch CNAME redirect (issue #149); ALSO marked smoke (runs under -m smoke); focused dispatch via -m safesearch",
    "upstream: live-VM upstream/external-block detection (issue #267); ALSO marked smoke (runs under -m smoke); focused dispatch via -m upstream",
    "reboot: live-VM guest-reboot regression (issue #334); REBOOTS the shared session VM, so distinct from -m smoke; deselected from the default run",
    "pfctl_bench: ADR-40 Phase 2 pfctl table benchmark; two-VM topology required; dispatch-only, NEVER PR-gating",
    "tick: live-VM due-ledger trigger-tick (ADR-43); ALSO marked smoke; focused dispatch via -m tick",
]

# coverage.py (issue #38). BRANCH coverage is the point of the sweep -- line
# coverage hides one-sided decision branches (a feature's ON path tested, its OFF
# path not). The canonical invocation is
#   python -m pytest --cov=pfb_unbound --cov-branch --cov-report=term-missing
# (pytest-cov drives coverage.py); these knobs make a bare `coverage run` branchy
# too and keep the TYPE_CHECKING-only import block out of the denominator. The
# report is INFORMATIONAL in CI -- no enforced floor yet (mirrors the shell kcov /
# PHP pcov informational coverage; #38 decides later whether to gate on a floor).
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.ruff]
# Minimum Python supported: pfSense CE 2.8 ships Python 3.11 (FreeBSD 15).
target-version = "py311"
line-length    = 120

[tool.ruff.lint]
# E/W = pycodestyle  F = pyflakes  I = isort
select = ["E", "F", "W", "I"]
# pfb_unbound.py places a few imports inside try/except optional-dependency
# guards (not at the top of the file); suppress only that. F401 (unused import)
# IS enforced -- the TYPE_CHECKING / runtime-stub imports ruff already counts as
# used, so nothing legitimate trips it.
ignore = [
    "E402",  # module-level import not at top of file (intentional try/except guards)
]

[tool.ruff.lint.per-file-ignores]
# Cross-module pytest fixture re-export: these files import the ``repo_vm`` fixture from
# ``test_repo_install`` so their cases can request it (pytest resolves fixtures per-module).
# Each case param then "redefines" the imported name from ruff's view — the standard
# re-export idiom, not real shadowing. F811 is suppressed only for these files.
"tests/smoke/test_software_update.py"              = ["F811"]
"tests/smoke/test_upgrade_config_stability.py"  = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["pfb_unbound"]

[tool.mypy]
python_version       = "3.11"
warn_unused_configs  = true
ignore_missing_imports = true
# Resolve `unboundmodule` (Unbound's runtime-injected API) to the dev/test stub
# in stubs/python/ so the TYPE_CHECKING import in pfb_unbound.py type-checks.
mypy_path            = "stubs/python"
# pfb_unbound.py predates type annotations; add hints incrementally rather
# than requiring full coverage up-front. follow_imports = silent so that running
# `mypy tests/` (the gate below) loads production modules the tests import (e.g.
# pfb_unbound.py) for their types but does NOT fail on their own incremental-typing
# errors -- the gate judges the test suite, not production.
follow_imports       = "silent"
# tests/smoke is the dispatch-only live-VM suite (ADR-04): it needs third-party
# deps that are not installed in the lint/CI type-check env, and is excluded from
# the default pytest run too (--ignore=tests/smoke). Keep it out of the gate.
exclude              = ['^tests/smoke/']

# The test suite, by contrast, IS fully type-annotated, and `mypy tests/` is a CI
# + pre-commit gate (see .github/workflows/test.yml, .githooks/pre-commit) that
# keeps it that way. This override makes that requirement explicit/strict for the
# test modules only; production stays incremental (above).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
