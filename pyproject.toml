[tool.pytest.ini_options]
# Run pytest from the repo root; no 'cd' needed in CI or locally.
testpaths = ["tests"]
# --ignore=tests/smoke keeps the default `python -m pytest` byte-for-byte as it
# was before ADR-04 Phase 3: the smoke package (VM fixture, mock feed server,
# its third-party deps) is NEVER imported during default collection, so a
# checkout without tests/smoke/requirements.txt installed still collects
# cleanly and runs the exact same unit set. The smoke workflow re-enables it
# with `pytest -m smoke --override-ini="addopts=" tests/smoke` (or
# `-p no:cacheprovider tests/smoke -m smoke`); see tests/smoke/conftest.py.
addopts   = "-v --ignore=tests/smoke"
markers = [
    "smoke: live-VM end-to-end smoke test (ADR-04); needs KVM + the GHCR pfSense image; deselected from the default run",
]

[tool.ruff]
# Minimum Python supported: pfSense CE 2.8 ships Python 3.11 (FreeBSD 15).
target-version = "py311"
line-length    = 120

[tool.ruff.lint]
# E/W = pycodestyle  F = pyflakes  I = isort
select = ["E", "F", "W", "I"]
# pfb_unbound.py uses module-level `global` declarations and bare except
# clauses for optional-dependency guards; suppress those specific rules.
ignore = [
    "E402",  # module-level import not at top of file (intentional try/except guards)
    "F401",  # imported but unused (some imports are conditional/side-effect)
]

[tool.ruff.lint.isort]
known-first-party = ["pfb_unbound"]

[tool.mypy]
python_version       = "3.11"
warn_unused_configs  = true
ignore_missing_imports = true
# Resolve `unboundmodule` (Unbound's runtime-injected API) to the dev/test stub
# in stubs/python/ so the TYPE_CHECKING import in pfb_unbound.py type-checks.
mypy_path            = "stubs/python"
# pfb_unbound.py predates type annotations; add hints incrementally rather
# than requiring full coverage up-front.
